[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jyotirganita"
version = "0.0.1"
description = "Name reservation for jyotirganita, a deterministic pañcāṅgam computation engine under active development. This release is a placeholder and contains no functionality."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Mathew", email = "mathew.physics@gmail.com" }]
keywords = ["panchanga", "pancangam", "indian-calendar", "astronomy", "siddhanta"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thomas-mathew-lab/jyotirganita"
Repository = "https://github.com/thomas-mathew-lab/jyotirganita"
Issues = "https://github.com/thomas-mathew-lab/jyotirganita/issues"

[tool.setuptools]
packages = ["jyotirganita"]
