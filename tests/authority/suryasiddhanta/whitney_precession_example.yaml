id: authority/suryasiddhanta/whitney_precession_example
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 245
pdf_page: 106
locus: 'Whitney''s note to iii. 9-12, printed p. 245: from ''Thus, let us find, in illustration of the process, the amount of precession on the first of January, [year].'' to the sentence giving the result (''... we find the actual distance of the initial point of the sphere from the equinox on the first of January, [year], to be ...''), the end of the paragraph.'
rounding: not stated
precision: hundredths of a second of arc
datum_keys: [texts.suryasiddhanta.procedures.declination.argument.iii10.suryasiddhanta_burgess_1860]
notes: 'Precession on 1 January 1860: the days of the current Age (Kali years before it being divisible by 7200) in the proportion days in an Age: revolutions in an Age:: days elapsed: part of a revolution; the bhuja (supplement) of that arc; multiplied by three and divided by ten (the libration of 27 deg). The passage between the proportion and the instance (''For a motion of ... etc.'') explains the libration with illustrative arcs in figures. The multiplier and divisor are first printed in words (three, ten) and then in figures in the proportion that follows; keyed from the figures. The year 1860, printed twice, is keyed once. Verse citations (under i. 53), (v. 10), (under ii. 29, 30) not keyed. Unit marks as printed: superscript d (days), rev (revolutions). Errata (suryasiddhanta_burgess_1860_reprint PDF 364) checked: no entry on this page or on its suryasiddhanta_burgess_1860_reprint counterpart. First read lat-b, fixture file sha256 8840448b.'
