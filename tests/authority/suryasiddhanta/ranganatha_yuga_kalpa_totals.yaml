source: suryasiddhanta_hall_1859
edition_page: 15
pdf_page: 27
locus: 'from the 2nd word of PDF 27 l. 1 (the end of the commentary on the verse numbered 16) to the sentence on the first twilight ending ''kalajnair uktah'' (PDF 29 l. 14), commentary on i.17-19 (Gudharthaprakasaka) (pdf_page as keyed: 27-29; edition_page as keyed: 15-17)'
rounding: none; integer divine years and integer years throughout
precision: integers (divine years for the ages and twilights; years for the Manu)
datum_keys: []
notes: 'Ranganatha divides the yuga into the ages and their twilights in divine years (4800 etc., their sixths, the half-sixth as each twilight), reconciles them with another authority (Manu''s text, values named other.manu.*, and the kalpa of a thousand yugas, other.kalpa_yugas_word), which are NOT this text''s data, then forms the Manu in years (71 mahayugas), adds a Krta as its twilight, and states the kalpa as fourteen such plus the first twilight in words only. Numbers stated in words are keyed as numeral_word (or text for the list of multipliers). Not keyed: the verse lines of i.17-19 themselves; restatements in words that only repeat the verse (PDF 28 l. 2 ''sastha'', PDF 29 l. 7 ''ekasaptatiyugarupa'', l. 8 ''caturdasasankhyakah'', l. 9 ''caturdasamanubhih'', l. 14 ''caturdasatve''). The kalpa total and the total of the twilights are not printed in digits on PDF 27-29. Errata (PDF 401): p. 15 l. 15 savisesaya -> savisesa (text, touches no value). Fixture pages: the first page recorded as the fixture''s page, the span in the locus.'
