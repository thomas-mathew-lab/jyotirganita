id: authority/suryasiddhanta/rao_saturn_four_steps
methods: [suryasiddhanta]
class: editor_computed
source: balachandra_rao_2000
edition_page: 113
pdf_page: 127
locus: '§9.4 Example: from "Example: Find the true position of Śani, by applying the … operations of the manda and śīghra corrections" (printed p. 113) to "P… = P… + SE… = ... = ..." (printed p. 116), before §9.5 (pdf_page as keyed: 127-130; edition_page as keyed: 113-116)'
rounding: angles to whole seconds; decimal degrees to 4-7 decimals; minutes to 4-5 decimals; squares to 2 decimals. Not stated whether rounded or truncated
precision: seconds of arc
datum_keys: []
notes: 'Four operations: P1 = MP + ½ SE1 (SE1 the śīghra equation from §9.3); P2 = P1 + ½ ME1 (manda correction for P1, with Śani''s mandocca from Table 9.2 values and the kalpa revolutions, periphery p = p_e − (p_e − p_o)|sin m|); P3 = MP + ME2 (manda correction for P2); P4 = P3 + SE2 (śīghra correction for P3, R = 3438, continuous trigonometric functions). Several printed figures disagree with the values they restate or with each other (Śani''s mean longitude in the first anomaly display is printed with 90 minutes; the periphery of the 3rd operation is printed with one more digit than the value used in ME2; the mandaphala in the 2nd operation carries a degree mark though in minutes) — each keyed as printed. Restatements of the inputs (MP, mean Sun, periphery and anomaly from §9.2) inside the displays, ½ factors and identical repeats are not keyed again. Fixture pages: the first page recorded as the fixture''s page, the span in the locus. Printed places (the review''s N9 (x)): each value''s `pdf_page` names the place it was keyed from. The Sun''s mean longitude keyed here is the same as the one keyed in rao_sighra_mercury_saturn (PDF 122), for the same date, and differs from rao_manda_sun_moon''s (PDF 107), whose date differs. §8.4 (PDF 110, not keyed) is a milestone item.'
