id: authority/suryasiddhanta/rao_manda_sun_moon
methods: [suryasiddhanta]
class: editor_computed
source: balachandra_rao_2000
edition_page: 93
pdf_page: 107
locus: '§8.3 example: from "Example: Find the equations of the centre and hence the true longitudes of the Sun and the Moon" (printed p. 93) to the Moon''s true longitude at the end of (ii) (printed p. 94) (pdf_page as keyed: 107-108; edition_page as keyed: 93-94)'
rounding: equations computed in decimal minutes to 4-8 decimals and converted to whole seconds; sines printed to 6-7 decimals; peripheries to 4 decimals of a degree; mean-anomaly conversions to 4-5 decimals of a degree. Rounding or truncation of the seconds is not stated
precision: seconds of arc
datum_keys: []
notes: 'Sun''s mandocca motion since the Kali epoch from the kalpa revolutions (Note, p. 93); then for the Sun and the Moon: mandakendra m = mandocca − mean longitude, corrected periphery, equation of the centre, true longitude. Periphery: Rao''s own formula (printed pp. 91-92, PDF 105-106), the periphery at the end of the even quadrants minus a third of a degree times |sin m|, "assuming that the variation is sinusoidally periodic" (his words), with the equation = (3438/360)[periphery] sin m expanded into two terms with decimal coefficients (the coefficients are inputs here). Sine: continuous decimal sine values (6-7 decimals), not the tabular Rsines of his Table 8.2 (PDF 106, not keyed). The mean longitudes after the deśāntara correction for Bangalore come from §7.5 (not keyed there by this context) and are inputs; the Moon''s mean longitude and mandocca listed on p. 93 differ from those used in (ii) on p. 94 (both keyed as printed). The restatement of the Sun''s mean longitude and mandocca at the head of (i), the restated factor in the periphery displays and the repeated fourth line of the Moon''s equation display are not keyed again. Fixture pages: the first page recorded as the fixture''s page, the span in the locus. Printed places (the review''s N9 (x)): each value''s `pdf_page` names the place it was keyed from. The Moon''s mean longitude and mandocca are printed at the head of §8.3 (PDF 107) and again as used in (ii) (PDF 108); both places are keyed and they differ (the values'' notes). The Sun''s mean longitude is keyed from PDF 107 only; §9.2 (PDF 122) and §9.4 (PDF 127) print the Sun''s mean longitude for another date (fixtures rao_sighra_mercury_saturn, rao_saturn_four_steps). §8.4 (PDF 110, handed to 2d, not keyed) prints one too; whether it differs from this fixture''s needs a read and is a milestone item.'
