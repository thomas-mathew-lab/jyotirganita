id: authority/suryasiddhanta/whitney_eclipse_solar_ahargana
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 449
pdf_page: 310
locus: 'note to ch. v (solar eclipse example), p. 449 (PDF 310): step "I. To find the sum of days (ahargana) from the commencement of the planetary motions to the time of calculation." to "Mean solar days elapsed, …" and the sentence "This, then, is the required ahargana ... about the time of new moon, …."; nothing after step I'
rounding: the two proportions printed as integers with no "+" mark (fractions dropped silently); all lines integers
precision: integers
datum_keys: [texts.suryasiddhanta.procedures.ahargana.rule]
notes: 'Sum of days from the commencement of the planetary motions (creation) to about new moon, May 1854, by the rule of i.45-51: kalpa sandhi + six manvantaras + 27 mahayugas, less the time spent in creation; plus the yugas of the current mahayuga and the Kali years to the Calivahana era, plus the era''s elapsed years; then months, intercalary months by proportion, lunar days, omitted lunar days by proportion, civil days. Input from outside the text: the Hindu date (close of Vaicakha, second month, Calivahana 1777). Several grouping separators in the first block print as points or a gap (e.g. "1,850.688,000", "1,951 992,000"); grouping dropped in all.'
