id: authority/suryasiddhanta/whitney_mean_places
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 178
pdf_page: 39
locus: note under i.53, p. 178 (PDF 39) from "We have calculated in this manner the positions of all the planets" to the table "Mean Places of the Planets, Jan. …st, … midnight, at Ujjayini." (column "According to the Surya-Siddhanta."); its explanation continues on p. 179 (PDF 40) to "under vv. …)."
rounding: whole seconds of arc
precision: seconds of arc
datum_keys: [texts.suryasiddhanta.procedures.mean_longitude.rule]
notes: 'Table heads as printed: "Planet." | "According to the Surya-Siddhanta." (sub-heads "(rev.)", s, deg, '', '''') | "The same corrected by the bija." (s, deg, '', ''''; a lead, not keyed). Per p. 178 the positions are reckoned from the beginning of the Iron Age (sum of days 1,811,945) with the revolution numbers of the lesser period of 1,080,000 years (v. 56); per p. 179 the prefixed numbers are complete revolutions since the epoch, and for the moon''s apsis and node the whole-Age revolution numbers were used and their longitude at the epoch added (vv. 57, 58). The node''s revolutions are printed "(267-)" (the node is retrograde); keyed 267 with negative: true from the trailing minus. Mercury and Venus rows give the planet''s own mean place (p. 179: "it is this which we have given for Mercury and Venus").'
