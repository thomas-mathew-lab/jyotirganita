datum_keys: [texts.suryasiddhanta.yojana_scale.statement.i59.suryasiddhanta_burgess_1860, texts.suryasiddhanta.yojana_scale.i59.n1.suryasiddhanta_burgess_1860, texts.suryasiddhanta.yojana_scale.i59.n2.suryasiddhanta_burgess_1860, texts.suryasiddhanta.yojana_scale.i59.n3.suryasiddhanta_burgess_1860]
notes: 'Demonstration of the rule of i.59 (circumference = square root of ten times the square of the diameter). With radius 3438 and circle 21600 minutes, divisor 6876 reduced to unity gives the multiplier three with eight-and-a-half parts, whose square 9;52,12 is taken as ten; then the Lord''s diameter 11384 with circumference 36000 gives multiplier 3;9,44 (three with ten-less-a-quarter parts), whose square 9;59,59 is nearly ten. Role judged from the text: a figure the text takes as given (radius, circle of 21600 minutes, the Lord''s diameter) is input; a figure obtained in the passage by doubling, division or squaring is output. Numbers written in words and restated in digits are keyed twice (word and digits) as printed. Restatements not keyed again: दश in दशगुणितः (p. 44 line 20) and in दशग्रहणेन (p. 44 line 21) restate the ten of line 19; २१६०० as गुण (line 15) is keyed because it is printed again as the multiplier of the proportion. Not keyed as numbers: त्रि in त्रिज्या (lines 14, and p. 45) as part of the technical term "radius"; रूप in गुणरूपगुणगुणितः (line 20) read as part of a compound naming the multiplier. Errata (suryasiddhanta_hall_1859 PDF 402) checked first: p. 44 l. 17 (गुणस्थान → गुणस्यैकस्थान) and p. 44 l. 20 (गुणरूप → मूलरूप) fall inside this extent and touch words, not figures (l. 20 on my count is the line with गुणरूपगुणगुणितः; l. 17 does not hold गुणस्थान on my count: गुणस्थाने stands on line 16 and गुणस्थानकरणार्थं on line 18; the entry most plausibly addresses the latter); p. 45 l. 16 (तन → तेन) and l. 20 (प्रक्षिपे → प्रक्षिपेद्योजये) fall outside this extent (commentary on i.60-61). First read deva-suryasiddhanta_bapudeva_1861, fixture file sha256 c303ece2.'
