locus: Ranganatha's commentary on i.59, from अत्रोपपत्तिः (p. 44, line 13 of the page counting text lines below the running head) to इत्युपपन्नमुक्तम् before ॥५९॥ (p. 45, line 5); spans printed pp. 44-45 (PDF 56-57)
rounding: not stated as a rule; the text takes the square 9;52,12 as ten "by small difference" (स्वल्पान्तरात्) and calls the second square 9;59,59 "nearly ten" (दशप्रायः)
