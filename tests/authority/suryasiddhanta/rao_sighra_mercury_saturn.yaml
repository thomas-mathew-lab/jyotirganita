id: authority/suryasiddhanta/rao_sighra_mercury_saturn
methods: [suryasiddhanta]
class: editor_computed
source: balachandra_rao_2000
edition_page: 108
pdf_page: 122
locus: '§9.2 Example (printed pp. 108-109: from "Example: Find the śīghra anomaly and, thus, the corrected periphery" to "= …° = ..." for Śani) and §9.3 Example (printed pp. 110-111: from "Example: Find the śīghra correction for Budha and Śani" to "Śīghra correction = + ..." for Śani); Table 9.3 cells (printed p. 108) as inputs (pdf_page as keyed: 122-125; edition_page as keyed: 108-111)'
rounding: anomalies to whole seconds and 3-4 decimals of a degree; peripheries to 4-5 decimals of a degree; intermediate minutes to 4-6 decimals; śīghraphala to 6-7 decimals of a degree and whole seconds. Not stated whether rounded or truncated
precision: seconds of arc
datum_keys: []
notes: '§9.2: śīghra anomaly m = śīghrocca − mean planet (for Śani the śīghrocca is the mean Sun), corrected periphery p = p_e − (p_e − p_o)|sin m| with p_e, p_o from Table 9.3 (only the Budha and Śani cells keyed). §9.3: dohphala, koṭiphala, sphuṭakoṭi, śīghrakarṇa, R sin(śīghraphala), śīghraphala, with R = 3438 and continuous trigonometric functions. Several printed intermediates disagree with the values they restate (the koṭiphala restated in the sphuṭakoṭi line for Budha; the dohphala restated in the karṇa line for Śani; Budha''s śīghraphala and the stated correction) — each printed figure keyed as printed. The mean positions are stated "after the deśāntara correction" for Bangalore and are inputs. Restatements identical to an earlier printed figure are not keyed again. Fixture pages: the first page recorded as the fixture''s page, the span in the locus. Printed places (the review''s N9 (x)): each value''s `pdf_page` names the place it was keyed from. The Sun''s mean longitude keyed here is the same as the one keyed in rao_saturn_four_steps (PDF 127), for the same date, and differs from rao_manda_sun_moon''s (PDF 107), whose date differs. §8.4 (PDF 110, not keyed) is a milestone item.'
