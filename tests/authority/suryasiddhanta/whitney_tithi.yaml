locus: 'Whitney''s note to ii. 66, printed p. 237: the paragraph from ''Thus, to find the date in lunar time of the midnight preceding the first of January, [year]'' to the end of its last sentence (''... to run.'').'
rounding: not stated
precision: minutes of arc; pranas (respirations)
datum_keys: [texts.suryasiddhanta.procedures.endings.tithi.ii66.suryasiddhanta_burgess_1860]
notes: 'The lunar day (tithi) at the given midnight: the sun''s longitude deducted from the moon''s; the remainder in minutes divided by the portion of a lunar day gives the current lunar day and the parts traversed and to be traversed; these multiplied by sixty and divided by the difference of the daily motions give the time passed since the lunar day began and still to run. The day of the date (first) and the lunar day''s number (eighth) are printed in words; the year in figures. Unit marks as printed: superscript s (signs), n v p (nadis, vinadis, pranas). Errata (suryasiddhanta_burgess_1860_reprint PDF 364) checked: no entry on this page. First read lat-b, fixture file sha256 8533cb83.'
