methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 169
pdf_page: 30
locus: 'note under i.34-40: p. 169 (PDF 30) from "The data here given are combinations of, and deductions from, those contained in the preceding passage (vv. …-…)." through the tabular computation "In … years. | In … years." ("Sidereal days," ... "Intercalary months,") continued on p. 170 (PDF 31) top ("Lunar months," ... "Omitted lunar days,")'
rounding: integers
precision: integers
datum_keys: []
notes: 'Whitney''s tabular restatement of the Age''s day and month counts (vv. 34-40): civil days = sidereal days - solar revolutions; solar months = years x 12; synodic months = moon''s sidereal revolutions - solar revolutions; intercalary months = synodic - solar months; lunar days = lunar months x 30; omitted lunar days = lunar days - civil days. Two columns, keyed one value per cell, named output|input.<row>.<column> with column age_4320000 ("In 4,320,000 years.") or part_1080000 ("In 1,080,000 years."). The computation begins on PDF 30 (it does not start earlier); the verse figures of vv. 37-39 in words on PDF 30 are the translation, not keyed here.'
