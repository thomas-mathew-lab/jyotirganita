datum_keys: [texts.suryasiddhanta.procedures.mean_longitude.rule]
notes: 'Mean longitudes of the Sun, Moon, Moon''s mandocca and Rāhu at mean midnight at Ujjayanī on the stated date from the Kali ahargaṇa, as A × revolutions / civil days of a mahāyuga plus the epoch position (Rāhu''s motion subtracted, 360° added). The epoch and the bodies'' positions at it are the author''s stated assumption; the ahargaṇa is stated, not derived on these pages. Restatements of a result in the running text and repeated restatements of the civil days and ahargaṇa within a section are not keyed separately. Table 7.3''s Siddhāntaśiromaṇi column is not used by this computation and not keyed. Fixture pages: the first page recorded as the fixture''s page, the span in the locus.'
