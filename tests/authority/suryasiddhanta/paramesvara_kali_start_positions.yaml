methods: [suryasiddhanta, suryasiddhanta_paramesvara_recension]
class: text_computed
source: suryasiddhanta_paramesvara_1957
edition_page: 6
pdf_page: 44
locus: 'Parameśvara''s commentary: (1) p. 6 (PDF 44 left half), after verse i.24, from "अस्मिन्पक्षे कलियुगादौ" to the end of the sentence ending "प्रक्षेप्यम्"; (2) p. 18 (PDF 50 left half), the last sentences before the footnotes, from "कलियुगादावपि" to the end of the sentence beginning "चन्द्रपातः".'
rounding: positions stated as sign boundaries (whole signs); no degrees or minutes printed
precision: signs
datum_keys: [texts.suryasiddhanta.procedures.mean_longitude.rule]
notes: 'The commentary states the mean positions at the start of the Kali yuga "in this system" (अस्मिन्पक्षे, p. 6): all planets at the end of Mīna, the Moon''s apogee at the end of Mithuna (printed यमान्ते with the editor''s parenthesis (युग्मान्ते)), Rāhu at the end of Kanyā; hence (p. 6) the planets'' motion may be computed from Kali time alone, adding three signs to the apogee and six to Rāhu. p. 18 restates the same three positions (मीनमेषसन्धौ, मिथुनान्ते, कन्यान्ते). Reader''s decision (TASK): they rest on the text''s elements alone — p. 6 attributes them to the text''s own system and applies no correction; on p. 18 they follow the hārāvayava (bhagaṇāvayava) correction passage of pp. 17-18 but are stated as the positions "also at the start of Kali" without applying it; the dṛk-correction verses at the top of p. 22 (ending दृक्साम्यसिद्धये कुर्यात् कल्यादौ ध्रुवका इति) are corrections to be applied to these Kali-start dhruvas, not included in them. No computation, ahargaṇa or intermediate figure is printed: the values are the stated results.'
