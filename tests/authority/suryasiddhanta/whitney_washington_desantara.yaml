datum_keys: [texts.suryasiddhanta.procedures.desantara.rule]
notes: 'Computes the deśāntara of Washington from the Hindu meridian: Ujjayinî and Washington from Greenwich in time, their sum, its value in nāḍī, vināḍī and prāṇa and in decimal nāḍīs, then the proportion 60 : 25.4718 :: 3936.75 : 1671.28 (the circumference at Washington from p. 184). The number of nāḍīs in a day is printed in words in parentheses ("(sixty)") and as a figure in the proportion. No suryasiddhanta_burgess_1860_reprint erratum falls on suryasiddhanta_burgess_1860 PDF 47 (suryasiddhanta_burgess_1860_reprint p. 42). First read lat-a, fixture file sha256 909e0df3.'
