datum_keys: [texts.suryasiddhanta.procedures.endings.naksatra.ii64.suryasiddhanta_burgess_1860]
notes: 'The yoga at the given time: the longitudes of moon and sun summed (whole revolutions dropped), in minutes, divided by the portion of a yoga give the yogas past, the current yoga, and its parts past and to come; these divided by the sum of the daily motions and multiplied by sixty give the time since it began and until it ends, in nadis. The counts of yogas past and the current yoga''s number are printed in words; they are keyed as integers with notes. The yoga''s name is restated at the end of the passage and keyed once. Unit marks as printed: superscript s (signs), n v p (nadis, vinadis, pranas). Errata (suryasiddhanta_burgess_1860_reprint PDF 364) checked: no entry on this page. First read lat-b, fixture file sha256 f2b1ae0f.'
