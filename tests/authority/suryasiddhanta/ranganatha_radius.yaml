id: authority/suryasiddhanta/ranganatha_radius
methods: [suryasiddhanta]
class: text_computed
source: suryasiddhanta_hall_1859
edition_page: 67
pdf_page: 79
locus: 'PDF 79 l. 8 (from its 3rd word) to l. 13 (to the last sine''s digit group, after ''etadardham antima jya''): the commentary on ii.15-16, the radius from the circumference'
rounding: the quotient 27000000/3927 is printed as the integer 6876; no rounding rule is stated on the page
precision: integers (minutes of arc)
datum_keys: []
notes: 'A rule of three: if a circumference of 3927 has a diameter of 1250, what diameter has the circle of 21600 minutes? 21600 x 1250 = 27000000, / 3927 = diameter 6876; half of it is the last sine 3438. The numbers 3927 and 1250 are first stated in words (l. 10) and again in the computation (l. 12-13). Errata (suryasiddhanta_hall_1859 PDF 402-403): no entry for printed p. 67.'
