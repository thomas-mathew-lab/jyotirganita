datum_keys: [texts.suryasiddhanta.procedures.ahargana.rule]
notes: Step I prints only the Hindu date, the elapsed time from the beginning of the Iron Age and the resulting sum of days; the intermediate lines (months, intercalary months, lunar days, omitted days) are not printed ("as found by the processes already sufficiently illustrated in the notes to i. 48-51"). The day count runs from the commencement of the Iron Age (i. 56), for mean midnight next preceding full moon. Calculations by the text alone, without the bija (p. 434). The Hindu date refers to the calendar of p. 174 (whitney_ahargana_1860).
