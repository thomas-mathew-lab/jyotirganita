id: authority/suryasiddhanta/whitney_mars_true_daily_motion
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 225
pdf_page: 86
locus: 'Whitney''s note to ii. 50-51, printed p. 225: (1) the paragraphs from ''In illustration of the rule'' to the line ''Mars''s true daily motion at the given time'' and its figure; (2) the table ''Results of the Processes for finding the True Daily Motion of the Planets'' at the foot of the same page, every cell. The paragraph between them (''In this calculation we have followed the rule stated in the text ...'') is outside the extent and not keyed.'
rounding: not stated
precision: seconds of arc
datum_keys: [texts.suryasiddhanta.procedures.gati.rule.ii48.suryasiddhanta_burgess_1860]
notes: 'Mars''s true daily motion at the same time as the previous examples: the equation of motion for the apsis applied to the mean daily motion gives the equated daily motion; the sun''s daily motion less that gives the equated synodical motion; the proportion hypothenuse: its excess above radius:: equated synodical motion: equation of the conjunction, additive since the hypothenuse exceeds radius; added to the equated motion it gives the true motion. The table gives the same quantities for the five planets. Table headings as printed: ''Planet.'', ''Diff. of sines.'' (unit mark ''), ''Equation of Apsis.'' ('' ''''), ''Equated Motion.'' ('' ''''), ''Equated Synod.Motion.'' ('' ''''), ''Equation of Conjunction.'' ('' ''''), ''True Motion.'' ('' ''''). The Planet column is the row label (Mercury, Venus, Mars, Jupiter, Saturn, each printed with a comma) and is not keyed as a value. Signs printed before the minutes are keyed as negative: true (minus) or false (plus). Verse citation (i. 34) and the ordinal ''third process'' not keyed. Errata (suryasiddhanta_burgess_1860_reprint PDF 364) checked: no entry on this page. Restated figures keyed once within the paragraph part; the table is keyed in full although its Mars row repeats the paragraph''s figures. First read lat-b, fixture file sha256 bc1bf93a.'
