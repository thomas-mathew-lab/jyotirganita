source: suryasiddhanta_hall_1859
edition_page: 43
pdf_page: 55
locus: 'from ''candrasya mandoccam tadanim'' (PDF 55 l. 5) to ''sanipatasya ...'' (l. 20): the commentary on i.58'
rounding: the positions are printed to seconds of arc
precision: seconds of arc (sign, degree, minute, second)
datum_keys: [texts.suryasiddhanta.procedures.mean_longitude.rule]
notes: 'The commentary gives as ksepakas the apsides (mandocca) of the Sun and the five planets and the nodes of the five planets at the end of the Krta, as sign|degree|minute|second. It prints no revolution number or elapsed-years figure on this page from which they are derived (it says, l. 12-14, that being slow they serve for a thousand years and their computation from the start of the Treta is omitted; the word sahasra there is not a computation input and is not keyed). For the Moon it adds 9 and 6 signs (apogee in Makara, node in Tula; numeral words keyed as inputs). Errata: p. 43 l. 19 Venus node 4|17|25|4 -> 4|17|25|48 (keyed as printed).'
