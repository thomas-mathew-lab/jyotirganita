id: authority/suryasiddhanta/whitney_periods_mean_motions
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 161
pdf_page: 22
locus: table "Mean Motions of the Planets." at the head of printed p. 161 (PDF 22), under i.34; columns explained on p. 160 (PDF 21) from "It is farther to be observed" to "the mean daily motions."
rounding: periods printed to hundredths of a respiration (p as a decimal); daily motions to tenths of the fourth sexagesimal order; p. 160 says the respirations become third-order sexagesimals by moving the point one place right
precision: 'period: 0.01 respiration (p); daily motion: 0.1 fourth ('''''''')'
datum_keys: []
notes: 'Table heads as printed: "Planet." | "Number of revolutions in 4,320,000 years." | "Number of revolutions in 1,080,000 years." | "Length of a revolution in mean solar time." (sub-heads d n v p) | "Mean daily motion." (sub-heads ° '' '''' '''''' ''''''''). Per p. 160 the period is the civil days in an Age (from v. 34) divided by the revolutions, in days, nadis, vinadis and respirations. The table has a single column per quantity (no bija or modern column on this page). The civil-day count it divides by is not printed in the table. Moon rows printed under the head "Moon:" as sider. rev., synod. rev., rev. of apsis, node. Sexagesimal values keyed as printed in their columns; a column left blank in print (no degrees for a body moving under 1 degree a day) keyed null. Decimals keyed as strings.'
