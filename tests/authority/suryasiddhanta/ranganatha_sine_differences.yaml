id: authority/suryasiddhanta/ranganatha_sine_differences
methods: [suryasiddhanta]
class: text_computed
source: suryasiddhanta_hall_1859
edition_page: 66
pdf_page: 78
locus: 'PDF 78 l. 7 (''yatha prathamakhandam'') to l. 19 (the quoted rounding verse); PDF 79 l. 17-20 (the first sine); PDF 80 l. 1-3 (the greatest khanda difference): the commentary on ii.15-16'
rounding: 'quotients are taken as integers: the commentary (l. 8) counts a fraction above a half as one; the quoted verse (input.rounding_verse) names the differences where that is not done (paraphrase; not keyed)'
precision: integers (minutes of arc); the greatest khanda difference to thirds
datum_keys: [texts.suryasiddhanta.procedures.interpolation.rule]
notes: 'Values span three pages: PDF 78 (printed 66), PDF 79 (printed 67), PDF 80 (printed 68); each value carries its own page. The commentary''s chain: each khanda (here the commentary''s word for the Rsine pinda: 225, 449, 671, 890, 1105) is divided by the first, the quotients summed, the first less the sum gives the next difference, which added to the previous khanda gives the next. Not keyed: ''dvigunaprathamam ekonam'' (l. 3, a rule statement, no digits), the numbers inside the quoted verse''s ablatives, and lemma words. Errata (suryasiddhanta_hall_1859 PDF 402-403): no entry for printed p. 66 or 67; p. 68 l. 12 and l. 21 do not touch these values.'
