id: authority/suryasiddhanta/whitney_sun_day_length
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 232
pdf_page: 93
locus: 'Whitney''s note to ii. 59, printed p. 232: from ''Thus, to find the length of the sun''s day'' to the end of the sentence giving the apparent day''s length (''... mean solar time.''); then the sentence ''According to the Nautical Almanac, it is ...'' that follows it, and the sentence ''By a similar process, the length of Jupiter''s day at the same time is found to be ...; by the Nautical Almanac, it is ...''.'
rounding: not stated
precision: hundredths of a prana (respiration); tenths of a second of time
datum_keys: [texts.suryasiddhanta.procedures.cara.day_night]
notes: 'Length of the sun''s apparent day: the sun''s longitude corrected by the precession places him in a sign whose rising time is given; the proportion minutes in a sign: rising time:: daily motion: excess gives the excess of his day over the sidereal day, additive since his motion is direct; the apparent day in nadis, vinadis and pranas and its equivalent in mean solar time; Jupiter''s day by a similar process. Units as printed: superscript s (signs), p (pranas, respirations), n (nadis), v (vinadis), h m s (hours, minutes, seconds of mean solar time); a decimal of the last part is printed after the unit mark. The ordinal ''tenth'' (the sign the sun is in) is a number word and is not keyed. both are keyed. The Nautical Almanac figures are the editor''s comparison values, not results of the text''s process. Errata (suryasiddhanta_burgess_1860_reprint PDF 364) checked: no entry on this page. First read lat-b, fixture file sha256 046da04c.'
