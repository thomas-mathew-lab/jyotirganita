edition_page: 204
pdf_page: 65
locus: 'note on ii.31-33, suryasiddhanta_burgess_1860 printed p. 204: from "The table of sines and versed sines gives only those belonging to arcs" to "The other rule is the reverse of this, and does not require illustration."'
rounding: intermediate and result printed as whole minutes (the proportion's fourth term and the sum); the 'actual value' printed to hundredths of a minute
precision: 'minutes of arc (actual value: hundredths of a minute)'
datum_keys: [texts.suryasiddhanta.procedures.interpolation.rule]
notes: 'Sine of 24 deg by linear interpolation in the table of sines (ii.31-32): 1440'' / 225 gives quotient and remainder, proportion over the tabular difference, result added to the sixth sine; compared with Whitney''s modern value. No inverse (ii.33) example is printed: Whitney says the other rule does not require illustration. The reference ''as stated in verse 28'' is not keyed. Uses the 6th tabular sine and the next tabular difference as printed here (not keyed from the table of ii.15-22).'
