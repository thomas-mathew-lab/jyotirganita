notes: 'The moon''s asterism: her true longitude in minutes divided by the portion of an asterism gives the number of asterisms traversed and the part of the current one passed and to come; these divided by her daily motion give the time spent in it and still to run. The verse citation (under v. 39) is not keyed; the word ''last'' beside the ordinal is not a separate figure. Unit marks as printed: superscript s (signs), v p (vinadis, pranas), d n v p (days, nadis, vinadis, pranas). Errata (suryasiddhanta_burgess_1860_reprint PDF 364) checked: no entry on this page. First read lat-b, fixture file sha256 bd734423.'
