id: authority/suryasiddhanta/whitney_moon_manda_equation
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 209
pdf_page: 70
locus: 'note on ii.39, suryasiddhanta_burgess_1860 printed pp. 209-210 (PDF 70-71): from "To give a farther and practical illustration of the process" (p. 209) to the line "Moon''s true longitude" (p. 210), before "We present below, in a briefer form"'
rounding: 'p. 210 (PDF 71, after the sun''s calculation): Whitney states he neglected the seconds, rejecting the fraction of a minute or counting it as a minute according as it was less or greater than a half; the moon''s mean anomaly and arcs are printed to seconds, the sines, epicycle and equation to whole minutes'
precision: seconds of arc for the longitudes and the anomaly; whole minutes for the sines, the epicycle diminution, the bhujaphala and the equation
datum_keys: [texts.suryasiddhanta.procedures.epicycle_variation.rule, texts.suryasiddhanta.procedures.manda.equation]
notes: 'Moon''s manda equation for 1860 Jan 1, midnight, Washington: mean longitude and apsis carried from Ujjayini by the desantara correction, mean anomaly, bhuja arc (anomaly in the fourth quadrant), base-sine and perpendicular-sine (by the interpolation of ii.31-32, values only stated), the epicycle diminished by the rule of ii.38 (radius 3438 in the proportion), bhujaphala by ii.39, its arc taken equal (below 225''), equation subtracted to the true longitude. Chapter i references printed beside the lines (''i. 53'', ''i. 60, 61'', ''ii. 29'') and verse numbers are not keyed. The sun''s companion calculation on p. 210 is keyed as a separate fixture (whitney_sun_manda_equation, proposed). Calendar of the date not stated on the page.'
