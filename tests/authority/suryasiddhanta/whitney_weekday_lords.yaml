id: authority/suryasiddhanta/whitney_weekday_lords
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 177
pdf_page: 38
locus: 'note under i.51-52, p. 177 (PDF 38): the table "Name of day. | Presiding Planet. | Succession, as Lord of day, month, year, hour." and the text from "As the … day of the subsistence" to "… as the lord of the year at the given time."'
rounding: integer division; remainders printed after "-"; a quotient with a dropped remainder printed with "+"
precision: integers
datum_keys: [texts.suryasiddhanta.procedures.weekday.rule]
notes: 'Weekday: (sum of days + 1 for Jan. 1 itself) divided by 7, remainder 1 = Sunday (first day of creation taken as a Sunday). Lord of the month: sum of days / 30, quotient x 2, + 1, / 7, remainder 7 = Saturn. Lord of the year: by the like process with x 3; only the final remainder (five) and the lord (Jupiter) are printed, no steps. The succession table (day, month, year, hour orders) is keyed as inputs; the day names (Ravivara ... Canivara, Sunday ... Saturday) are row labels, named in the loci. suryasiddhanta_burgess_1860_reprint errata (suryasiddhanta_burgess_1860_reprint p. 364) "p. 32, l. 20 - for 84-88 read 31" falls on p. 176 (PDF 37) line 20 ("see below, xii. 84-88"), a chapter-verse cross-reference, not a figure of this computation; nothing keyed from PDF 37 (it has no figure of the computation).'
