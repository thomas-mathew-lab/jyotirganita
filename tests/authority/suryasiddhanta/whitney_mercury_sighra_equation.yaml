id: authority/suryasiddhanta/whitney_mercury_sighra_equation
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 213
pdf_page: 74
locus: 'note on ii.40-42, suryasiddhanta_burgess_1860 printed pp. 213-214 (PDF 74-75): from "In illustration of the process, we will calculate the equation of the conjunction of …" (p. 213) to the table "Results of the … Process for finding the True Places of the Planets" and "This is, however, only a … step" (p. 214)'
rounding: whole minutes for sines, proportions, hypotenuse and equation; longitudes and commutation to seconds; the squares and their sum printed as integers (of whole-minute quantities)
precision: seconds of arc for longitudes and commutation; minutes for the rest
datum_keys: [texts.suryasiddhanta.procedures.sighra.equation]
notes: 'Mercury''s sighra equation for midnight preceding 1860 Jan 1, Washington: conjunction longitude from Ujjayini plus desantara, mean commutation (the mean longitude is the sun''s), bhuja and koti arcs, sines, epicycle diminished at M (one degree less at D than at O, stated in words), bhujaphala and kotiphala by proportion, kotiphala subtracted from radius 3438 (commutation between three and nine signs, stated in words, not keyed), squares, sum, square root (variable hypotenuse), sine of the equation by proportion, arc by the rule of ii.33; then the table of the first process for all five planets (form: table, one row per planet). Arc-from-sine and sine values are stated, not worked. Chapter references not keyed.'
