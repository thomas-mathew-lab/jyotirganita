id: authority/suryasiddhanta/whitney_moon_true_daily_motion
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 223
pdf_page: 84
locus: 'Whitney''s note to ii. 51 (continuing the example of ii. 47-49), printed p. 223: from ''Moon''s mean daily motion (i. 30)'' to the line ''Moon''s true daily motion at given time'' and its figure; then the sentence ''The equation of the sun''s motion, calculated in a similar manner, is found to be ... and his true motion ...''. The intervening sentence on the roughness of the process is outside the extent and not keyed.'
rounding: not stated
precision: seconds of arc
datum_keys: [texts.suryasiddhanta.procedures.gati.rule.ii48.suryasiddhanta_burgess_1860]
notes: 'Moon''s true daily motion: mean daily motion less apsis motion gives mean anomalistic motion; the difference of tabular sines at the moon''s mean anomaly, by the proportion sine-table interval : difference :: anomalistic motion : increase of sine, gives the daily increase of the sine of anomaly; by 360 deg : epicycle :: increase : equation, the equation of motion, subtractive here; mean motion less equation gives true daily motion. Then the sun''s equation of motion and true motion as results only. Verse citations (i. 30), (i. 33), (ii. 15-27), verse 49 and the number words nine and three (signs) in the rule''s condition are not keyed. Errata (suryasiddhanta_burgess_1860_reprint PDF 364) checked: no entry on this page. Figures restated in the proportions and the second subtraction are keyed once. First read lat-b, fixture file sha256 caa46fc4.'
