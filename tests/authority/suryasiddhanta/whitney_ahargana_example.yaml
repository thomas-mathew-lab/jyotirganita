id: authority/suryasiddhanta/whitney_ahargana_example
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 175
pdf_page: 36
locus: 'note under i.48-51: p. 174 (PDF 35) from "The process will be best illustrated" through the skeleton calendar ("Solar Year." and "Luni-solar Year."); p. 175 (PDF 36) from "The table shows that …" to "Total number of civil days from end of creation to beginning of …"'
rounding: the two proportions are printed with the integer part followed by "+" (fraction dropped); all other lines integers
precision: integers (months, lunar days, civil days)
datum_keys: [texts.suryasiddhanta.procedures.ahargana.rule, texts.suryasiddhanta.procedures.computation_instant.statement]
notes: 'Sum of days (ahargana) from the end of creation to the beginning of Jan. 1, 1860 by the rule of vv. 48-51. Inputs from outside the text: the skeleton calendar of I.A. 4960-4962 (Whitney constructed it: "we have constructed the following skeleton of a Hindu calendar for the year 4961 of the Iron Age") and the Hindu date it gives for Jan. 1, 1860 (eighth day of the tenth month of 4961). Calendar dates keyed as printed, "do." (ditto) kept as printed (it repeats the year above). The constants used (51,840,000 solar months, 1,593,336 intercalary months, 1,603,000,080 lunar days, 25,082,252 omitted lunar days in an Age) are printed only inside the proportions. Day count is at midnight on the Hindu prime meridian (p. 175).'
