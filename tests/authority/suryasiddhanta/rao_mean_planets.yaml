methods: [suryasiddhanta]
class: editor_computed
source: balachandra_rao_2000
edition_page: 81
pdf_page: 95
locus: '§7.4: from "Example: Find the mean longitudes of the … planets" (printed p. 81) to the end of item (5) "(after removing the nearest integral multiple of …°)" (printed p. 82); inputs from Table 7.4 (printed p. 81, mean daily motion column) and Table 7.3 (printed p. 78, Sūryasiddhānta column, planets'' rows) (pdf_page as keyed: 95-96; edition_page as keyed: 81-82)'
rounding: products printed to 1-3 decimals of a degree; the reduced longitudes printed to whole seconds (Kuja, Guru, Śani) or whole minutes (Budha's and Śukra's śīghroccas); the author says "there is a small amount of rounding off error" and that "the nearest integral multiple of 360°" is removed
precision: seconds of arc (minutes for the two śīghroccas)
datum_keys: [texts.suryasiddhanta.procedures.mean_longitude.rule]
notes: 'A × mean daily motion (decimal degrees, 7 decimals) reduced mod 360°, for Kuja, Budha''s śīghrocca, Guru, Śukra''s śīghrocca and Śani at the midnight stated in the example. The daily motions are Rao''s decimal derivation from the revolution numbers in the same table (the revolution column and the caption''s civil days are not keyed; only the cells the computation uses). The epoch positions of Table 7.3 enter only implicitly (no addition is shown). Fixture pages: the first page recorded as the fixture''s page, the span in the locus.'
