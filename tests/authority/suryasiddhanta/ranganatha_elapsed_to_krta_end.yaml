methods: [suryasiddhanta]
class: text_computed
source: suryasiddhanta_hall_1859
edition_page: 34
pdf_page: 46
locus: 'from ''yatha divyabdasya sauravarsani'' (PDF 46 l. 1) to the digit group before ''||47||'' (l. 10): the end of the commentary on i.47'
rounding: none; integer years throughout
precision: integers (years; the creation interval also in divine years)
datum_keys: [texts.suryasiddhanta.procedures.epoch.any_yuga]
notes: 'A chain of products and sums: a divine year of 360 years times 12000 gives the mahayuga; times 71 a Manu; times 6 six Manus; plus seven twilights; plus 27 mahayugas; plus a Krta: years of the kalpa elapsed; less the creation interval (47400 divine years times 360): years elapsed (from creation) to the end of the Krta. Multipliers stated in words are keyed as numeral_word. Errata: p. 34 l. 9 gatabda -> srstigatabda (label only).'
