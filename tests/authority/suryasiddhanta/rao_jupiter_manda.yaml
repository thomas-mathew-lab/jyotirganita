id: authority/suryasiddhanta/rao_jupiter_manda
methods: [suryasiddhanta]
class: editor_computed
source: balachandra_rao_2000
edition_page: 104
pdf_page: 118
locus: '§9.1 Examples (i) and (ii): from "Examples: (i) Find the mandocca of Guru as on …" to "Guru''s mandaphala ... = ..." and "Since Guru''s anomaly m is less than …°, the mandaphala is additive." (printed p. 104)'
rounding: mandocca motion printed to whole minutes; anomaly to whole minutes and one decimal of a degree; periphery to 6 decimals of a degree and whole seconds; mandaphala to 5 decimals of a minute and whole seconds. Rounding or truncation not stated
precision: minutes of arc (mandocca, anomaly); seconds (periphery, mandaphala)
datum_keys: []
notes: (i) Jupiter's mandocca at the date = epoch position (Table 9.2, as restated in the text) + kalpa revolutions × 360° × A / civil days in a kalpa. (ii) manda anomaly m = mandocca − mean longitude, corrected periphery p = p_e − (p_e − p_o)|sin m| (Rao's rule as on pp. 91-92), mandaphala = 3438' × (p/360°) × sin m with continuous sine (the sine value itself is not printed). Jupiter's mean longitude used in (ii) is stated in signs-degrees-minutes and its source is not shown on this page. The value of 32°6'35" is printed in an italic type unlike the rest (pasted correction look). Restatements (the mandocca in m, 62.9° inside the sine, 360°) are not keyed again.
