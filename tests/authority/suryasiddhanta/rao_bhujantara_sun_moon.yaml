notes: 'The bhujāntara correction = equation of the centre of the Sun × daily motion of the body / 21600'': first the mean form for the Moon (mean daily motion, its reciprocal factor), then the Example with the true daily motions of the Sun and the Moon on the stated date, added to the true longitudes. The true daily motions are stated, not derived on these pages. The Sun''s longitude to which the correction is added differs from the true longitude of §8.3 (fixture rao_manda_sun_moon); keyed as printed. The final Sun''s result is printed in a different (italic, hand-set-looking) type. Restatements of the equation and daily motions inside the displays are not keyed again. Fixture pages: the first page recorded as the fixture''s page, the span in the locus.'
