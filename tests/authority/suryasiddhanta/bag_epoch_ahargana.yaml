id: authority/suryasiddhanta/bag_epoch_ahargana
methods: [suryasiddhanta, suryasiddhanta_paramesvara_recension]
class: editor_computed
source: bag_2001
edition_page: 57
pdf_page: 3
locus: 'Bag, "Ahargaṇa and weekdays as per modern Sūryasiddhānta", IJHS 36: the mahāyuga elements (journal p. 58, from "Ms = no. of saura months" to the omitted days) and footnote 9 (p. 58); the epochs t0-t3 (p. 60, from "Let t… = epoch of Sūryasiddhānta" to "t… = ... …."); computations (i)-(iii) (pp. 60-61, from "(i) To derive t… from t…" to "leaves the remainder r… = ..."); (iv) Table of remainders for weekdays (p. 62) (pdf_page as keyed: 3-4, 6-8; edition_page as keyed: 57-58, 60-62)'
rounding: intercalary months and omitted days taken as integers ("Only integer values for these ratios were used in actual practice", p. 60); the printed quotients look truncated but the rule is not stated beyond that sentence
precision: integers (days, months)
datum_keys: [texts.suryasiddhanta.procedures.ahargana.rule]
notes: 'Ahargaṇa by the Sūryasiddhānta rule (I.46-50 as Bag cites it): years Y → saura months m_s = 12Y, intercalary m_I = m_s M_I/M_S, lunar days d_L = 30(m_s + m_I), omitted d_o = d_L D_O/D_L, ahargaṇa a = d_L − d_o, weekday by a mod 7, for (i) the text''s epoch to the Kali epoch, (ii) Kali to Śaka 427, (iii) Kali to Śaka 587. The D_O used in the computations differs from the D_O derived on p. 58; the D_L of p. 58 is printed with a digit missing in one line; the dividend of the last remainder line is printed with a digit missing — each keyed as printed. Constants restated in every line (the mahāyuga M_I, M_S, D_O, D_L, the factors 12 and 30 after (i)) are keyed once. Not keyed: the Kalpa figure on p. 57 (not used), the Sanskrit verse (I.46-50) and its translation (which restates the Kṛtayuga figure keyed in (i)), the concluding remarks. Fixture pages: the first page recorded as the fixture''s page, the span in the locus.'
