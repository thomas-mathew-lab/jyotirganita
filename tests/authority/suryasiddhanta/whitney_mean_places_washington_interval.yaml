edition_page: 188
pdf_page: 49
locus: 'note under i.67: p. 187 (PDF 48) from "In order to furnish a practical test" to "office of the American Nautical Almanac, at Cambridge."; p. 188 (PDF 49) table "Mean Longitudes of the Planets, Jan. …st, … midnight, at Washington.", column "According to Surya-Siddhanta: text."'
rounding: whole seconds of arc
precision: seconds of arc
datum_keys: [texts.suryasiddhanta.procedures.epoch_advance.rule]
notes: 'Mean longitudes for the time after Ujjayini midnight of Jan. 1, 1860 equal to Washington''s distance in time (the interval keyed in two printed forms). The motions for the interval are not printed (only the resulting longitudes). The Surya-Siddhanta column is reckoned from the vernal equinox of that date, not from the text''s initial point: p. 187 says "The longitudes are given as reckoned from the vernal equinox of that date, which we make to be distant 18deg 5'' 8".25 from the point established by the Surya-Siddhanta as the beginning of the Hindu sidereal sphere" (that point described as 10'' east of zeta Piscium, not keyed). Table heads as printed: "Planet." | "According to Surya-Siddhanta: text." | "with bija." | "According to moderns." (deg, '', '''' each); only the text column keyed; the bija and moderns columns and the following table "Errors of the Mean Longitudes of the Planets, as calculated according to the Surya-Siddhanta." on p. 188 are leads, not keyed.'
