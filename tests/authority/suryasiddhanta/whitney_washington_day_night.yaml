id: authority/suryasiddhanta/whitney_washington_day_night
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 234
pdf_page: 95
locus: 'Whitney''s note to ii. 61-63, printed p. 234: from ''In illustration of the process, we will calculate the respective length of the sun''s day and night at Washington'' to ''... mean solar time.'' (two paragraphs, with two proportions set on their own lines).'
rounding: not stated
precision: hundredths of a digit; minutes of arc; pranas (respirations); tenths of a second of time
datum_keys: [texts.suryasiddhanta.procedures.cara.day_night, texts.suryasiddhanta.procedures.half_day.day_radius.ii60.suryasiddhanta_burgess_1860, texts.suryasiddhanta.procedures.sunrise.statement.xiv18.suryasiddhanta_burgess_1860]
notes: 'Day and night at Washington: the equinoctial shadow of the twelve-digit gnomon at the latitude; the proportion gnomon : shadow :: sine of declination : earth-sine; the earth-sine reduced to a great circle by day-radius : radius :: earth-sine : sine of ascensional difference; its arc in degrees and minutes, in minutes of arc, and in time (a minute of arc taken as a respiration); the day''s length (from v. 59) quartered, increased and diminished by the ascensional difference and doubled, gives night and day in nadis and in mean solar time. Verse citations (iii. 17), (under v. 59) and the number words twelve (gnomon digits, restated in figures in the proportion), quarter and double are not keyed as values beyond the figure 12. Unit marks as printed: superscript d (digits), n v p (nadis, vinadis, pranas), h m s; the decimal follows the unit mark. Errata (suryasiddhanta_burgess_1860_reprint PDF 364) checked: no entry on this page. First read lat-b, fixture file sha256 d118d5a9.'
