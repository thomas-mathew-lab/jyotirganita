notes: 'The commentary states that the kalpa ahargaṇa less the creation time, counted from Sunday, leaves remainder 3 on division by 7 at the start of the Tretā, so that the ahargaṇa counted from the Tretā start begins with Wednesday. No ahargaṇa figure is printed; only the divisor, the remainder and the weekday. Reader''s decision (TASK): this rests on the text''s elements alone (civil days of the kalpa, the creation time i.24, the yuga lengths); a weekday remainder involves no planetary correction (hārāvayava, dṛgbheda), though the passage stands in Parameśvara''s Tretā-start (laghu) reckoning introduced by the quoted verses. Footnote 5 (मू. पुस्तके): सप्तहृतावशेस्त्रिसंख्यस्स्यात् (spelling only; remainder word त्रि unchanged), clip [460,468,690,508].'
