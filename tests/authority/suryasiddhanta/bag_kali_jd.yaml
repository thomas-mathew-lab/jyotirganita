id: authority/suryasiddhanta/bag_kali_jd
methods: [suryasiddhanta, suryasiddhanta_paramesvara_recension]
class: editor_computed
source: bag_2001
edition_page: 62
pdf_page: 8
locus: 'bag_2001 (Bag 2001): from "The astronomical Kali epoch is placed by all Siddhānta-writers at" (p. 62) to "and JD number = ..." (p. 63), with footnote 12 (p. 63). bag_2003_weekdays (Bag, "A note on the ahargana and the weekdays"): items (2)-(4) (p. 40), Discussion (1)-(2) (p. 41), the continuation on p. 42 to "on Friday, −… AD Feb. … UMT … AM.", and Notes and References note 2 (p. 42) (pdf_page as keyed: bag_2001 PDF 8-9; bag_2003_weekdays PDF 2-4; edition_page as keyed: bag_2001 pp. 62-63; bag_2003_weekdays pp. 40-42)'
rounding: JD numbers as integers; one decimal JD (bag_2003_weekdays p. 41) to two decimals; weekdays by remainder mod 7 counted from Monday (JD) or Friday/Sunday/Tuesday (KA)
precision: days
datum_keys: []
notes: 'The Julian day of the Kali epoch in the ardharātrika (midnight) and audayika (sunrise) systems, the Kali ahargaṇa (KA) and JD of the two Śaka epochs (427 and 587), and their weekday checks; bag_2003_weekdays answers a private communication that put each JD one less, and its note 2 is an erratum to bag_2001 p. 63 (the KA of the 427 Śaka epoch). The bag_2001 p. 63 figure is keyed as printed. The values in bag_2003_weekdays called "wrong" by the author and those he adopts are both keyed as printed. A JD figure in bag_2003_weekdays (4) prints a digit different from the same JD a line above, and one in (3) repeats the adopted JD where the argument needs the communication''s figure — each keyed as printed. Edition pages: bag_2001 journal = PDF + 54; bag_2003_weekdays journal = PDF + 38. The bag_2003_weekdays reference list cites the earlier paper as IJHS 37.1-2 (2001) 55-63 while the held file is catalogued as volume 36. Fixture pages: the first page recorded as the fixture''s page, the span in the locus. Whose elements: Bag follows Shukla''s edition (suryasiddhanta_paramesvara_1957; bag_2001 p. 58, footnote), so his arithmetic uses suryasiddhanta_paramesvara_1957''s elements, which differ from suryasiddhanta_burgess_1860''s and suryasiddhanta_hall_1859''s on two Moon revolution numbers; a figure here that depends on the elements (the Kali ahargaṇa of a Śaka epoch) checks suryasiddhanta_paramesvara_1957''s recension, not suryasiddhanta_burgess_1860''s or suryasiddhanta_hall_1859''s (the review''s N4).'
