id: authority/suryasiddhanta/whitney_declination
methods: [suryasiddhanta]
class: editor_computed
source: suryasiddhanta_burgess_1860
edition_page: 230
pdf_page: 91
locus: 'Whitney''s note to ii. 58, printed p. 230: the table ''Results of the Process for finding the Latitude and Declination of the Planets'' (title in two lines), only its columns ''Declination.'' and ''Corrected Declination.'', every row (Sun, Moon, Mercury, Venus, Mars, Jupiter, Saturn).'
rounding: not stated
precision: minutes of arc
datum_keys: [texts.suryasiddhanta.procedures.declination.with_latitude.ii58.suryasiddhanta_burgess_1860]
notes: 'Table columns as printed: ''Planet.'', ''Longitude of Node.'' (s ° '' ''''), ''do. corrected.'' (s ° ''), ''Distance from Node.'' (s ° ''), ''Sine.'' (''), ''Latitude.'' (° ''), ''Decl:nation.'' (° ''; the i of the heading is damaged in the print), ''Corrected Declination.'' (° ''). Only the last two columns are keyed. Each declination cell is printed as degrees, minutes and a direction letter N. or S.; S. is keyed as negative: true, N. as negative: false, the letter recorded in notes. The precession figure is stated in the paragraph above the table, line 4 of the paragraph beginning ''We present in the annexed table'', after ''the precession at the given time being, as found under verses 9-12 of the next chapter,''; it is not keyed here (another fixture''s result). Errata (suryasiddhanta_burgess_1860_reprint PDF 364) checked: no entry on this page. First read lat-b, fixture file sha256 80b50ad9.'
