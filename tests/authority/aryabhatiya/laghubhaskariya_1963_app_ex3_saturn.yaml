locus: the appendix 'Theory of the pulveriser', §2.4, 'Ex. 3. The residue of the revolution (bhagaṇa-śeṣa) of Saturn is … ; find the days (ahargaṇa) and the revolutions performed by Saturn, given that the formula for the Sun's revolutions for A days is 36641A/….' and its solution, pp. 107–108 (PDF 180–181); the same example by the alternative method of §2.5, p. 109 (PDF 182)
rounding: none (integers)
precision: integers, as printed
datum_keys: [texts.aryabhatiya.saturn.revolutions, texts.aryabhatiya.civil_days.laghubhaskariya_1963]
notes: Shukla's example (editor_computed); the same problem as mahabhaskariya_1960's mahabhaskariya_1960_ch1_saturn_residue (residue 24, the same answer). The question prints 'the Sun's revolutions' where the figures are Saturn's abraded revolution number and civil days (146564 and 1577917500 divided by 4; the reader's observation; kept as printed in the locus, not a keyed value). The reduced chain's intermediate columns (p. 108) are not keyed; the chain's quotients, the reduced dividend and divisor, the mati, the final pair and the §2.5 pair are. The forward test is Saturn's mean longitude at ahargaṇa 346688814 from the keyed revolution number and civil days.
