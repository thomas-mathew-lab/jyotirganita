class: editor_computed
source: mahabhaskariya_1960
file: mahabhaskariya_1960-mahabhaskariya-shukla-1960.pdf
edition_page: 66
pdf_page: 151
locus: Shukla's note on III.8, p. 66 (PDF 151) from 'Now we will calculate the ascensional differences of Aries, Taurus, and Gemini for a place having … for the equinoctial midday shadow.' with '(1) Calculation of the ascensional difference of Aries.' through p. 67 (PDF 152) to p. 68 (PDF 153) '… This is the ascensional difference of Gemini.'; and p. 68 fn 1, its English sentences to 'Four times of these are …, … and … asus approx.'
rounding: '''approx.'' printed after the quotients; the footnote calls the body''s figures ''approximate values'' and gives ''better values'' to two decimals'
precision: whole minutes and whole asus in the body ('approx.'); hundredths of an asu in fn 1
datum_keys: [texts.aryabhatiya.procedures.cara.rule, texts.aryabhatiya.procedures.rsine.rule.mahabhaskariya_1960, texts.aryabhatiya.procedures.arc_from_rsine.rule.mahabhaskariya_1960, texts.aryabhatiya.procedures.cara.rule.mahabhaskariya_1960, texts.aryabhatiya.procedures.cara.signs_rule.mahabhaskariya_1960, texts.aryabhatiya.procedures.declination.rule.mahabhaskariya_1960]
notes: The item numbers (1)–(3) are not keyed; the shadow input, printed as a word, is keyed. The Devanagari reading after 'give the following reading of the text:' in fn 1, with the figures printed beside it, is outside the extent (a lead) and was not keyed. The radius '(=3438′)' before the extent is not keyed. The body's rounded quotients are the editor's approximations (fn 1 says so). the body's 'approx.' figures lie within one asu of the exact cara; the editor's Rsine of 60° is the modern value, one minute off the table's; fn 1's better values for Aries + Taurus and Aries + Taurus + Gemini are reproduced neither from the table nor from the editor's printed intermediates to the hundredth (residuals attributed to the editor's arithmetic, route not identified).
