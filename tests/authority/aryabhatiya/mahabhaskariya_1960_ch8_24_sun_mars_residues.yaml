id: authority/aryabhatiya/mahabhaskariya_1960_ch8_24_sun_mars_residues
methods: [aryabhatiya]
class: editor_computed
source: mahabhaskariya_1960
file: mahabhaskariya_1960-mahabhaskariya-shukla-1960.pdf
edition_page: 45
pdf_page: 130
locus: VIII.24-24* (pp. 224–225, PDF 309–310), solved by Shukla as I.52 'Example 3. "Some number of days is (severally) divided by the (abraded) civil days for the Sun and for Mars. The (resulting) quotients are unknown to me; the residues, too, are not seen by me. … The remainder for the Sun is …, and that for Mars is …. From these remainders severally calculate, O mathematician, the ahargaṇas for the Sun and Mars and also the ahargaṇa conforming to the two residues and state them in proper order."', pp. 45–46 (PDF 130–131)
rounding: none (integers)
precision: integers, as printed
datum_keys: [texts.aryabhatiya.sun.revolutions, texts.aryabhatiya.mars.revolutions, texts.aryabhatiya.civil_days.laghubhaskariya_1963]
notes: 'Footnote 1 on p. 45: ''Bhāskara I''s example, occurring in his comm. on Ā, ii. 32-33. Also see MBh, viii. 24-24*.'' The question is Bhāskara I''s; the solution and its figures are Shukla''s (editor_computed). The two remainders are the remainders of the residue times the abraded revolution number divided by the abraded civil days. The forward test is those two remainders at ahargaṇa 132133125 (Shukla''s A), from the keyed revolution numbers and civil days. Shukla''s ''and that for Mars 931'' (p. 46) names λ where the parallel with the Sun''s a = 8833 would name b = 640000 (the reader''s observation); kept as printed under output.mars_lambda and not used by the test.'
