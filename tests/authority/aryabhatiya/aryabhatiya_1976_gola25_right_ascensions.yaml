id: authority/aryabhatiya/aryabhatiya_1976_gola25_right_ascensions
methods: [aryabhatiya]
class: editor_computed
source: aryabhatiya_1976
file: aryabhatiya_1976-aryabhatiya-v1-1976.pdf
edition_page: 133
pdf_page: 207
locus: 'Gola 25, the editors'' note, p. 133 (PDF 207): formulae (1)–(3) (their figures only) and from ''Now, Rcos δ₁=…′'' to ''right ascension of Gemini=γ—β=… respirations.''; and p. 134 (PDF 208) Table 22 ''Right ascensions of the signs of the ecliptic'', six rows (Sign; Right ascension in respirations; Sign)'
rounding: none stated on the page; whole minutes and whole respirations as printed
precision: whole minutes of arc and whole respirations (asus), as printed
datum_keys: [texts.aryabhatiya.procedures.rsine.rule, texts.aryabhatiya.trig.statement, texts.aryabhatiya.procedures.day_radius.rule.aryabhatiya_1976, texts.aryabhatiya.procedures.declination.not_stated_note.aryabhatiya_1976]
notes: Respirations (prāṇas, asus) are keyed in unit 'asus'. The serial numbers 1–12 and the sign names of Table 22 are row labels, not keyed; the table's number is not keyed. The 'Indian method' derivation below the table is outside the extent. The dash in 'β—α' and 'γ—β' is a subtraction sign. the right ascensions by the editors' formula with the text's Rsines, the Rsine of the colatitude of the greatest declination taken as the day-radius at the solstice, lie within one unit of the printed figures (the editors work in modern trigonometry).
