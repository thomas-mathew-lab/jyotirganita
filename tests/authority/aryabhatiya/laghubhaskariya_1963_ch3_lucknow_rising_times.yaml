id: authority/aryabhatiya/laghubhaskariya_1963_ch3_lucknow_rising_times
methods: [aryabhatiya]
class: editor_computed
source: laghubhaskariya_1963
file: laghubhaskariya_1963-laghubhaskariya-shukla-1963.pdf
edition_page: 46
pdf_page: 119
locus: 'Shukla''s note on III.6: ''The following table gives the times of rising in asus of the tropical signs at Lucknow.'' and the table (Sign; Time of Rising in asus at Lucknow, each row ''…∓…=…''; Sign), six rows Aries–Virgo paired with Pisces–Libra'
rounding: none stated on the page; the table prints whole asus
precision: whole asus, as printed
datum_keys: [texts.aryabhatiya.procedures.cara.rule]
notes: 'The serial numbers of the signs (1–12) are row labels, not keyed. Each row is keyed as its three figures: the time of rising at Laṅkā, the ascensional difference at Lucknow, and the result. In the Virgo row the sign before the result is printed as a single bar where the other rows print ''=''. the latitude of Lucknow is not printed on the page, so the engine''s ascensional differences are not compared.'
