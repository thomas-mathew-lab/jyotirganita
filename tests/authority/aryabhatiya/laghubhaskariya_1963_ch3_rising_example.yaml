id: authority/aryabhatiya/laghubhaskariya_1963_ch3_rising_example
methods: [aryabhatiya]
class: editor_computed
source: laghubhaskariya_1963
file: laghubhaskariya_1963-laghubhaskariya-shukla-1963.pdf
edition_page: 51
pdf_page: 124
locus: Shukla's example on III.17–19, p. 51 (PDF 124) from 'We shall illustrate this rule by an example. Suppose that … ghaṭīs after sunrise at Lucknow …' through p. 52 (PDF 125) to '… we get …ˢ …° …′ as the tropical longitude of the rising point of the ecliptic.'
rounding: '''approx.'' printed after both quotients; no rule stated'
precision: whole asus and whole minutes of arc, as printed ('approx.')
datum_keys: [texts.aryabhatiya.procedures.cara.rule, texts.aryabhatiya.time_units.vinadikas_per_nadi, texts.aryabhatiya.time_units.pranas_per_vinadika]
notes: 'The example uses the Lucknow table of p. 46 (fixture laghubhaskariya_1963_ch3_lucknow_rising_times); the cross-reference ''(See the table of times of risings of signs at Lucknow on page …)'' is not keyed. Ordinals (''…ᵗʰ sign'') are keyed as integers; ''sixth'' printed as a word is not keyed. Reader''s observation, not resolved: several printed figures do not follow from the page''s own other figures (see the read notes on output.residue_rising, output.after_sign5, output.sign6_part_minutes); also the untraversed portion as printed does not equal a sign less the Sun''s degrees as printed. All keyed as printed.'
not_run: the lagna example of laghubhaskariya_1963 III.17–19 (the rising point from a time after sunrise), which the engine does not compute; keyed as a lead, to be compared when the engine serves it
