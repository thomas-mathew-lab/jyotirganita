id: authority/aryabhatiya/mahabhaskariya_1960_ch8_21_22_sun_moon_weekdays
methods: [aryabhatiya]
class: editor_computed
source: mahabhaskariya_1960
file: mahabhaskariya_1960-mahabhaskariya-shukla-1960.pdf
edition_page: 223
pdf_page: 308
locus: VIII.21-22, 'The Sun and Moon on a Sunday at sunrise are carefully seen by me in (the sign) Libra. …', and Shukla's solution with cases (i)–(iii), pp. 223–224 (PDF 308–309)
rounding: the longitudes to the printed second (the text's question gives degrees and minutes and the seconds to add or subtract)
precision: seconds of arc; whole days
datum_keys: [texts.aryabhatiya.sun.revolutions, texts.aryabhatiya.moon.revolutions, texts.aryabhatiya.civil_days.laghubhaskariya_1963, texts.aryabhatiya.procedures.weekday.rule]
notes: 'Footnote 2: ''Bhāskara I''s example, occurring in his comm. on A, ii. 32-33.'' The question is Bhāskara I''s; the solution and its figures are Shukla''s (editor_computed). Shukla states without working that the two longitudes hold on a Sunday 7500 days after the Kali epoch; the forward test is the Sun''s and the Moon''s mean longitudes at ahargaṇa 7500, to the printed second, and the weekday of 7500 (Sunday). Like the ch. I fixture''s, this weekday runs one day behind laghubhaskariya_1963 I.8 and mahabhaskariya_1960''s own rule (texts.aryabhatiya.procedures.weekday.rule.mahabhaskariya_1960, p. 19), under which the remainder 0 is a Friday; it is Bhāskara I''s problem statement, and that the example''s ahargaṇa is the day''s ordinal is an inference. The test compares the weekday differences modulo 7 only. Footnote 3: ''131493125 … is the L.C.M. of 210389 and 2155625.'''
