locus: 'VIII.23 (p. 224, PDF 309; Bhāskara I''s problem, footnote 1: ''This example has been solved in Chapter I under stanza 49. See supra, p. 40.''), solved by Shukla as I.49 ''Example 2. "The revolutions, etc., of the Sun''s mean longitude, calculated from an ahargaṇa plus a few nāḍīs elapsed, have now been destroyed by the wind; … minutes are seen by me to remain intact. Say the ahargaṇa, the Sun''s (mean) longitude, and the correct value of the nāḍīs (used in the calculation)."'', p. 40 (PDF 125)'
rounding: minutes of arc, the fraction dropped
precision: minutes of arc; whole days and nāḍīs
datum_keys: [texts.aryabhatiya.sun.revolutions, texts.aryabhatiya.civil_days.laghubhaskariya_1963, texts.aryabhatiya.procedures.residue.from_longitude.mahabhaskariya_1960]
notes: 'Footnote 1 on p. 40: ''Bhāskara I''s example, occurring in his comm. on Ā, iii. 32-33, and in MBh, viii. 23.'' (the chapter is printed iii here and ii in the footnotes on pp. 37 and 39). The question is Bhāskara I''s; the solution and its figures are Shukla''s (editor_computed). Shukla''s y is the minutes traversed since the beginning of Kaliyuga and 71 the remainder of the division; the forward test is the Sun''s mean longitude at ahargaṇa 720 plus 3 nāḍīs, to the printed minute (11 signs 19° 41′).'
