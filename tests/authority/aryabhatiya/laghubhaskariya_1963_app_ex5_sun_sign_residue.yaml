notes: 'Shukla''s example (editor_computed). The second pulveriser''s denominator is printed 210339 for 210389 (emendation, the page''s own figures). The printed ''y=5800'' is not the quotient of the printed equation: 576 × 176564 − 82977 = 483 × 210389, so y = 483 revolutions, and 12 × 483 + 4 = 5800 is the count of signs from the first pulveriser''s v = 4 (the reader''s arithmetic). Whether the editor''s 5800 counts signs, as the question''s ''the revolutions and signs'' allows, or is a slip is not settled from the page; it is kept as printed, not emended, and the engine test checks 12 × revolutions + v against it with that reading named. Cross-check queue.'
