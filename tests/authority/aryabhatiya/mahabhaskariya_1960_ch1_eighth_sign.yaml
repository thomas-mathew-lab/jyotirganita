source: mahabhaskariya_1960
file: mahabhaskariya_1960-mahabhaskariya-shukla-1960.pdf
edition_page: 41
pdf_page: 126
locus: I.51, 'Example. "Given that … minutes of the eighth sign are to be traversed by the Sun, say quickly, after carefully considering, O intelligent one, if the Gaṇita of Āśmaka is known to you, all the years that have elapsed this day since the beginning of Kaliyuga. Also say the number of days that have elapsed since the beginning of Kaliyuga."' and Shukla's solution with the Note on Govinda Svāmī's interpretation, pp. 41–42 (PDF 126–127)
rounding: the residue taken as the next integer above the quotient (as computed on the page)
precision: whole days; whole years
datum_keys: [texts.aryabhatiya.sun.revolutions, texts.aryabhatiya.civil_days.laghubhaskariya_1963, texts.aryabhatiya.procedures.residue.from_longitude.mahabhaskariya_1960]
notes: 'Footnote 2 on p. 41: ''Bhāskara I''s example, occurring in his comm. on Ā, ii, 32-33.'' The question is Bhāskara I''s; the solution and its figures are Shukla''s (editor_computed). The residue is printed 123707 in the text line and 123701 in the equation; the solution satisfies 123701. Here the residue is the next integer above the quotient (123700.94; Govinda Svāmī''s 71104 from 71103.69, the reader''s arithmetic), where the I.46–49 examples drop the fraction. Bhāskara I''s reading gives the same day as mahabhaskariya_1960_ch1_sun_observed (ahargaṇa 105345, 288 years; 4 signs 28° 20′ plus 7 signs 100′ is a whole circle). The forward test is the Sun''s mean longitude at both ahargaṇas.'
