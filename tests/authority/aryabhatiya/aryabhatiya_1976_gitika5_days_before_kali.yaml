id: authority/aryabhatiya/aryabhatiya_1976_gitika5_days_before_kali
methods: [aryabhatiya]
class: editor_computed
source: aryabhatiya_1976
file: aryabhatiya_1976-aryabhatiya-v1-1976.pdf
edition_page: 8
pdf_page: 82
locus: the editors' introductory note to the Gītikā section, p. 8 (PDF 82), on the beginning of the Kalpa and the Earth's rotation, and their note on Gītikā 5, p. 9 (PDF 83)
rounding: 'none: whole years and days; the sidereal rotation printed to a tenth of a second'
precision: years and days exact, as printed; the rotation to 0.1 s, as printed
datum_keys: [texts.aryabhatiya.kalpa.manus, texts.aryabhatiya.kalpa.yugas_per_manu, texts.aryabhatiya.kali.manus_elapsed, texts.aryabhatiya.kali.yugas_elapsed, texts.aryabhatiya.kali.quarter_yugas_elapsed, texts.aryabhatiya.civil_days.rule, texts.aryabhatiya.earth.rotations]
notes: 'The editors'' arithmetic (editor_computed): the years and civil days from the Kalpa''s beginning to the beginning of the current yuga and of Kali (p. 8, the same figures again on p. 9 for Kali), and the length of a sidereal rotation of the Earth (p. 8). The figures follow from the Gītikā 5 counts and Gītikā 3''s civil days and rotations of a yuga of 43,20,000 years (the reader''s observation). The modern rotation value the editors print beside it (23h 56m 4s·091, from W. M. Smart) is not keyed.'
