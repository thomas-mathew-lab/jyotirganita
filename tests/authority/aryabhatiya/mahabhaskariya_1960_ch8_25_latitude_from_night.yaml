locus: 'VIII.25 ''One example on the determination of the latitude: 25. The Sun being at the end of (the sign) Gemini, the length of the night is … ghaṭīs. Calculate and give out the latitude and also the colatitude of the place.'' and Shukla''s fn 2 ''Assuming the obliquity of the ecliptic to be …°…′, the required latitude comes out to be …°…′ approx.'''
rounding: '''approx.'' printed after the answer; no rule stated'
precision: whole minutes of arc, as printed ('approx.')
datum_keys: [texts.aryabhatiya.procedures.cara.rule, texts.aryabhatiya.procedures.rsine.rule.mahabhaskariya_1960, texts.aryabhatiya.time_units.nadis_per_day, texts.aryabhatiya.procedures.cara.rule.mahabhaskariya_1960, texts.aryabhatiya.procedures.day_length.rule.mahabhaskariya_1960]
notes: The problem is Bhāskara I's (input in the verse translation); the assumption and answer are Shukla's footnote (editor_computed). The verse asks for latitude and colatitude; fn 2 prints one figure, labelled 'the required latitude'. The obliquity is the editor's assumption, not the text's. The verse number is not keyed. The half-day rule gives the ascensional difference from the night; inverting the earthsine rule gives a latitude well below the editor's; the editor's answer is reproduced to the minute only by modern trigonometry with twice that ascensional difference (attributed to the editor's arithmetic).
