source: mahabhaskariya_1960
file: mahabhaskariya_1960-mahabhaskariya-shukla-1960.pdf
edition_page: 39
pdf_page: 124
locus: I.49 (the time-pulveriser), 'Example 1. "The (mean) longitude of the Sun for midnight is found to be … signs, … degrees, … minutes, and … seconds. Quickly say the ahargaṇa and the revolutions (performed by the Sun) according to the Āśmakīya."' and Shukla's solution, pp. 39–40 (PDF 124–125)
rounding: seconds of arc, the fraction dropped
precision: seconds of arc; whole days
datum_keys: [texts.aryabhatiya.sun.revolutions, texts.aryabhatiya.civil_days.laghubhaskariya_1963, texts.aryabhatiya.procedures.residue.from_longitude.mahabhaskariya_1960]
notes: 'Footnote 2 on p. 39: ''Bhāskara I''s example, occurring in his comm. on Ā, ii. 32-33,''. The question is Bhāskara I''s; the solution and its figures are Shukla''s (editor_computed). The longitude is for midnight under the Āśmakīya (Āryabhaṭa''s sunrise) reckoning: Shukla''s equation (3) uses x − 1/4 days and calls x − 1 the required ahargaṇa (as printed, p. 39). The forward test is the Sun''s mean longitude at ahargaṇa 1750 plus three quarters of a day (the midnight before the sunrise of day 1751), to the printed second.'
