id: authority/aryabhatiya/mahabhaskariya_1960_ch1_sun_sunrise_weekday
methods: [aryabhatiya]
class: editor_computed
source: mahabhaskariya_1960
file: mahabhaskariya_1960-mahabhaskariya-shukla-1960.pdf
edition_page: 37
pdf_page: 122
locus: I.48 (the week-day pulveriser), 'Example. "The mean longitude of the Sun (for sunrise) on a Wednesday is stated to be … signs, … degrees, … minutes, and … seconds. Say correctly after how much time (since the beginning of Kaliyuga) will the Sun again assume the same position (at sunrise) on a Thursday, Friday, and Wednesday."' and Shukla's solution with cases (i)–(iii), pp. 37–38 (PDF 122–123)
rounding: seconds of arc, the fraction dropped (Shukla's residue 155222 is the quotient)
precision: seconds of arc; whole days
datum_keys: [texts.aryabhatiya.sun.revolutions, texts.aryabhatiya.civil_days.laghubhaskariya_1963, texts.aryabhatiya.procedures.residue.from_longitude.mahabhaskariya_1960, texts.aryabhatiya.procedures.weekday.rule]
notes: 'Footnote 2 on p. 37: ''Bhāskara I''s example occurring in his comm. on Ā, ii. 32-33.'' The question is Bhāskara I''s; the solution and its figures are Shukla''s (editor_computed). The forward test is the Sun''s mean longitude at ahargaṇa 1000, 421778, 842556 and 1473723 (the printed seconds, fraction dropped) and the weekday of each (Wednesday, Thursday, Friday, Wednesday). The weekday offsets agree with the VIII.21-22 fixture''s Sunday at 7500 (by the reader''s arithmetic, not printed: both put the remainder 0 on a Thursday) and run one day behind laghubhaskariya_1963 I.8 and mahabhaskariya_1960''s own rule (texts.aryabhatiya.procedures.weekday.rule.mahabhaskariya_1960, p. 19), under which the remainder 0 is a Friday. The weekdays are Bhāskara I''s problem statements and Shukla''s solution takes differences only; that the examples'' ahargaṇa is the day''s ordinal is an inference. The test compares the weekday differences modulo 7 only. The I.48 rule is not keyed as a datum: the engine solves no pulveriser.'
