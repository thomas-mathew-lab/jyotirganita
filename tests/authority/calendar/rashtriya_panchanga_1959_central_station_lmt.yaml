  value: All calculations contained in this Panchang have been made for an adopted Central Station in India situated on 82° 30′ Longitude East of Greenwich and 23° 11′ Latitude North (latitude of Ujjain), and accordingly the timings of different phenomena have been given in this Panchang in local mean time of this Central Station, which is known as theIndian Standard Time
