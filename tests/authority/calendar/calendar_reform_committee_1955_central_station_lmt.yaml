methods: [calendar]
class: editor_computed
source: calendar_reform_committee_1955
file: calendar_reform_committee_1955-calendar-reform-committee-1955.pdf
edition_page: 14
pdf_page: 26
locus: 'calendar_reform_committee_1955 printed p. 14, left column, item 33 "All-India Central Station": the first paragraph (the offset of Indian time from Universal Time) and the second paragraph''s last sentence (the place, by its longitude east of Greenwich)'
rounding: 'as printed: the offset to half an hour, the longitude to half a degree'
precision: 'print quantum: half an hour of time (the offset); half a degree of longitude, two minutes of time (the place)'
datum_keys: [time_standards.ist.definition.calendar_reform_committee_1955]
notes: 'The Committee''s own statement of the offset of Indian time from Universal Time and of the place recognised as the Central Station (class editor_computed: a modern body''s statement, not a text''s arithmetic). Second witness of the offset in calendar_reform_committee_1955 itself: time_standards.ist.definition.calendar_reform_committee_1955 (printed [40], PDF 52). The longitude''s fraction on p. 14 is filled in by the printing; recommendation (8) on printed p. 7 (PDF 19, right column) prints the same place''s longitude with a legible fraction, and the read of p. 14 was checked against that tile (clip [485, 668, 525, 687], 900 dpi upsampled, native 300 ppi). Caveat (condition 4): at the Central Station the local mean time is the standard time by definition, so the local-to-standard difference there is zero; this fixture pins the sign, the degrees-to-time scale and the day boundary of the longitude step of the derived UT chain, and no nonzero local-to-standard difference at a Kerala place is printed in calendar_reform_committee_1955 or rashtriya_panchanga_1959.'
