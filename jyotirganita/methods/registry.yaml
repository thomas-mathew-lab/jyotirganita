  notes: The Sūrya-siddhānta as Burgess and Whitney translate it (suryasiddhanta_burgess_1860), Hall and Bāpū Deva's text with Raṅganātha's commentary (suryasiddhanta_hall_1859) the witness of every element (tools/suryasiddhanta_collation.py), suryasiddhanta_paramesvara_1957 (Parameśvara's recension, Shukla 1957) and suryasiddhanta_bapudeva_1861 where the two differ. The count runs from the end of creation and is placed on the Kali era record; runs_from is the Kali epoch. The deśāntara, bhujāntara, cara, sunrise, gati and endings are taken from suryasiddhanta_burgess_1860 i.60–67, ii.46–66, iii.9–10, iii.17b and xiv.18–19, the cara's carry composed and the precession's sign suryasiddhanta_burgess_1860's worked example; a Kerala place reaches the text by route (b) through the identification of its prime meridian (texts.suryasiddhanta.meridian.identification.suryasiddhanta_burgess_1860). composed is an A.D. year.
- id: suryasiddhanta_paramesvara_recension
  engine: siddhantic
  base: suryasiddhanta
  layers: []
  replaces:
    texts.suryasiddhanta.moon_apogee.revolutions: texts.suryasiddhanta.witness.suryasiddhanta_paramesvara_1957.moon_apogee.revolutions
    texts.suryasiddhanta.moon_node.revolutions: texts.suryasiddhanta.witness.suryasiddhanta_paramesvara_1957.moon_node.revolutions
  variants: {}
  procedures: {}
  composed: texts.suryasiddhanta.composed.statement.suryasiddhanta_burgess_1860.add30_final_reduction.year
  status: provisional
  sources: [suryasiddhanta_paramesvara_1957, suryasiddhanta_burgess_1860, suryasiddhanta_hall_1859]
  notes: 'The Sūrya-siddhānta as the text stands in Shukla''s edition with Parameśvara''s commentary (suryasiddhanta_paramesvara_1957), which differs from the vulgate of suryasiddhanta_burgess_1860 and suryasiddhanta_hall_1859 in the Moon''s apogee and node revolutions and in nothing else the collation found (a development report, not shipped). The two numbers are the reading of Shukla''s text and of the commentator families his Introduction tables name (suryasiddhanta_paramesvara_1957 Intro pp. 16, 51; keyed as variants on the two data), not numbers Parameśvara states as his own corrections; the recension''s own date is the gap texts.suryasiddhanta.composed.recension.suryasiddhanta_paramesvara_1957. suryasiddhanta_paramesvara_1957''s copy is not durable, so nothing of this method reaches verified until a durable copy is held. Its carry, sunrise and endings are its base''s.'
