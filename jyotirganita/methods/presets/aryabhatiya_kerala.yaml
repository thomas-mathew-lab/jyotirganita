preset: aryabhatiya_kerala
header:
  represents: The Āryabhaṭīya's own computation (the pure 499 CE element set, with Bhāskara I's procedures as Shukla edits them, mahabhaskariya_1960, laghubhaskariya_1963), at the text's sunrise and the observer's place, under the Kerala profile's conventions (regions/kerala/conventions.yaml), created for the dating of Kerala records.
  hypothesis: That a Kerala reckoner computed by the bare Āryabhaṭīya, without Haridatta's śakābda-saṃskāra, and named its months by the Kerala profile's month rule; no almanac is claimed to have printed this computation, and which records, if any, were so computed is what the comparisons test. The month rule is the profile's default aparāhna rule (provisional on sewell_dikshit_1896's statement alone), following_day selectable; the Kollam year starts at Siṃha by default, Kanyā selectable.
  range: docs/verification.md prints the computed date range (from the method's runs_from, no upper end) and the effective composition date; neither is typed here.
method: aryabhatiya
variants: {}
conventions: kerala
time_standard: text_local:aryabhatiya
intraday: intraday.linear_gati
sunrise: text
output:
  elements: [tithi, nakshatra, yoga, karana]
  scripts: [latin]
engine_data:
  text: aryabhatiya
  layers: []
observer:
  required: true
