preset: suryasiddhanta_kerala
header:
  represents: The Sūrya-siddhānta's own computation as Burgess and Whitney translate it (suryasiddhanta_burgess_1860), with Hall and Bāpū Deva's text and Raṅganātha's commentary (suryasiddhanta_hall_1859) the witness of its elements, counted from the end of creation (i.48–51), at the text's sunrise and the observer's place, under the Kerala profile's conventions (regions/kerala/conventions.yaml), created for the dating of Kerala records.
  hypothesis: That a Kerala reckoner computed by the Sūrya-siddhānta and named its months by the Kerala profile's month rule; no almanac is claimed to have printed this computation, and which records, if any, were so computed is what the comparisons test. The deśāntara, bhujāntara, cara and the text's sunrise are left for later work. The month rule is the profile's default aparāhna rule (provisional on sewell_dikshit_1896's statement alone), following_day selectable; the Kollam year starts at Siṃha by default, Kanyā selectable.
  range: docs/verification.md prints the computed date range (from the method's runs_from, no upper end) and the effective composition date; neither is typed here.
method: suryasiddhanta
variants: {}
conventions: kerala
time_standard: text_local:suryasiddhanta
intraday: intraday.linear_gati
sunrise: text
output:
  elements: [tithi, nakshatra, yoga, karana]
  scripts: [latin]
