- key: modern.ayanamsa.iae_lahiri.initial_point
  value: For the purpose of calculation of rasis, nakshatras and yogas, an initial point which occupies a fixed position on the ecliptic has been adopted as the origin for the measurement of longitudes. The position of this initial point coincides with the vernal equinoctial point of vernal equinox day of 285 A.D. For the purpose of assigning a precise position to it, the tropical longitude of this initial point has been adopted as 23° 15′ 00″ for 0^h on 21st March, 1956. The tropical longitude of this fixed initial point for any day is known as ayanamsa. The longitude of a celestial body measured from this initial point is known as nirayana longitude
  form: text
