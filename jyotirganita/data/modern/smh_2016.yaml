- key: modern.deltat.smh2016.tidal_statement
  value: We have investigated the effect on ΔT of using slightly different values of the lunar tidal acceleration before and after AD 1600. We compared the latest JPL longitudes of the Moon at epochs back to 700 BC with the analytical theory j = 2, incorporating a tidal acceleration of −26.00″ cy^−2. The differences in longitude, employing the same value of the precession constant, are plotted in figure 1. They are negligible in the medieval and ancient period compared to the precision of the observations. This is not the case after AD 1600, where the systematic difference ranges from about +2″ at AD 1700 to zero at AD 1900, in the sense DE430 − (j = 2). These account for the systematic differences in ΔT after AD 1600 between this analysis (see §4) and previous work by Stephenson & Morrison [5]. The values of ΔT derived in this paper should be used in conjunction with the lunar ephemeris JPL DE430, or with other ephemerides in which the tidal acceleration is close to the value of −25.82″ cy^−2 implicit in the JPL ephemeris
