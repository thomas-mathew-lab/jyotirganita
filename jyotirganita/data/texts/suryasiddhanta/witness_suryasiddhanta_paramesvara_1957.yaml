iants, moved here: suryasiddhanta_paramesvara_1957 commentary (Parameśvara), p. 46 अक्षगुणोऽर्कघ्नः पलभा लम्बकोद्धृतः: (e) the commentary''s quotation of the half-verse, not a variant of the text line; मू फलभालम्ब्रकोद्धृताः: (e) a footnote on the commentary''s quotation, not a variant of the text line.'
