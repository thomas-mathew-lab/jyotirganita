  emendation: null
  notes: 'sign name मकर (Capricorn) in the compound मकरादौ, at the beginning of मकर; unit word: आदि (beginning) — the Moon apogee (शशाङ्कोच्च) is at the start of मकर at the end of the Krta. Not a bhutasankhya word: the position is given by naming a sign (word.system sign_name). Decode convention used: the value is the number of whole signs counted from the start of मेष (Aries) to the start of the named sign, in the order of the twelve signs from मेष; that order is not stated on these pages (not read here), and the sign named is the tenth in that order. Equivalent longitude: value × 30 degrees, 0 minutes. The verse states no degrees or minutes for it; l.2 (निरंशत्वं गताश्चान्ये नोक्तास्ते मन्दचारिणः) says the other slow-moving ones (the apsides and nodes of the other bodies) are not stated as having reached a no-degree point. No footnote on PDF 55; no errata entry on the verse lines (errata 43/19 falls in the commentary digits, p. 43 l. 19). the reader''s count of whole signs from Meṣa was its own convention.'
