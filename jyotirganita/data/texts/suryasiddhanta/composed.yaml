    on: 2026-10-11
    dpi: 410
    clip: [20, 50, 370, 110]
    delivered_ppi: 410
    max_edge: 2000
    note: PDF 28, from "time as Bentley" to "to in-"; "dicate ... case." on clip [20, 95, 370, 188.33]
  status: double_read
  verified_by: []
  emendation: null
  notes: 'A counterfactual: what date ("early in the sixteenth century") internal evidence would have given had the text been altered; included because it speaks to the text''s date. A comma-like speck after "Now" on PDF 27 is printed as a comma. Pdf_page 27-28 recorded as its first page, the span in the locus. Edition_page 166-167 recorded as its first page, the span in the locus.'
