- key: texts.suryasiddhanta.composed.statement.suryasiddhanta_burgess_1860.add30_final_reduction
  value: Whatever may have been the date of the first communication of the elements out of which the Hindu system was elaborated, there is good reason to suppose that its final reduction to its present form did not take place until some time during the fifth and sixth centuries. That period is distinctly pointed out by the choice of the equinox of A. D. 570 as the initial and principal point of the fixed sphere (note to i. 27), by the definition of position of the junction-stars of the asterisms (p. 355), and by the Hindu traditions which refer to that time the names of greatest prominence and authority in the early history of the science.
