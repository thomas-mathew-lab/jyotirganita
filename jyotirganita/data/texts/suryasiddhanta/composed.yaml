- key: texts.suryasiddhanta.composed.statement.suryasiddhanta_burgess_1860.alteration_hypothesis
  value: 'Now, as things are wont to be managed in the Hindu literature, it would be no matter for surprise if such corrections were incorporated into the text itself: had not the Sûrya-Siddhânta been, at the beginning of the sixteenth century, so widely distributed, and its data so universally known, and had not the Hindu science outlived already that growing and productive period of its history when a school of astronomy might put forth a corrected text of an ancient authority, and expect to see it make its way to general acceptance, crowding out, and finally causing to disappear, the older version—such a process of alteration might, in our view, have passed upon it, and such a text might have been handed down to our time as Bentley would have pronounced, upon internal evidence, to have been composed early in the sixteenth century; while, nevertheless, the original error of the sun would remain, untouched and increasing, to indicate what was the true state of the case.'
  form: text
  unit: none
  script: latin
  source: suryasiddhanta_burgess_1860
  edition_page: 166
  pdf_page: 27
  locus: Whitney's note on i.34, printed p. 166 last paragraph, the sentence from "Now, as things are wont" (p. 166) to "the true state of the case." (p. 167); Latin text convention (em dash U+2014; line-end hyphens joined) (spans PDF 27-28, printed p. 166-167)
  read:
  - by: claude-opus-5-5/2026-10-11-r3
    on: 2026-10-11
    dpi: 410
    clip: [20, 440, 370, 552]
    delivered_ppi: 410
    max_edge: 2000
    note: PDF 27, from "Now, as things" to "handed down to our"
