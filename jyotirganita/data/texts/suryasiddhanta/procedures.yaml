- key: texts.suryasiddhanta.procedures.sighra.equation
  value: 'The result from the perpendicular-sine (koṭiphala) of the distance from the conjunction is to be added to radius, when the distance (kendra) is in the half-orbit beginning with Capricorn; but when in that beginning with Cancer, the result from the perpendicular-sine is to be subtracted. To the square of this sum or difference add the square of the result from the base-sine (bâhuphala); the square root of their sum is the hypothenuse (karṇa) called variable (cala). Multiply the result from the base-sine by radius, and divide by the variable hypothenuse: The arc corresponding to the quotient is, in minutes, etc., the equation of the conjunction (çâighrya phala); it is employed in the first and in the fourth process of correction (karman) for Mars and the other planets.'
