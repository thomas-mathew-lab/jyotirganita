- key: texts.suryasiddhanta.procedures.bhuja_koti.rule
  value: Subtract the longitude of a planet from that of its apsis (mandocca); so also, subtract it from that of its conjunction (çîghra); the remainder is its anomaly (kendra); from that is found the quadrant (pada); from this, the base-sine (bhujajyâ), and likewise that of the perpendicular (koṭi). In an odd (vishama) quadrant, the base-sine is taken from the part past, the perpendicular from that to come; but in an even (yugma) quadrant, the base-sine (bâhujyâ) is taken from the part to come, and the perpendicular-sine from that past.
