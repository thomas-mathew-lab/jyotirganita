- key: texts.suryasiddhanta.procedures.interpolation.rule
  value: Divide the minutes contained in any arc by two hundred and twenty-five; the quotient is the number of the preceding tabular sine (jyâpiṇḍaka). Multiply the remainder by the difference of the preceding and following tabular sines, and divide by two hundred and twenty-five; The quotient thus obtained add to the tabular sine called the preceding; the result is the required sine. The same method is prescribed also with respect to the versed sines.
  form: text
  unit: none
  script: latin
  source: suryasiddhanta_burgess_1860
