- key: texts.suryasiddhanta.procedures.cara.application
  status: gap
  reason: the text applies the cara to the half-day and half-night only (ii.61–63); no verse of i.60–67, ii.43–47 or ii.59–63 applies it to a longitude
  searched: 'suryasiddhanta_burgess_1860 translations and Whitney''s notes of i.60-67 (PDF 43-49: i.60-61 desantara, i.62 meridian, i.63-65 longitude by lunar eclipse, i.66 weekday, i.67 hour of the day), ii.43-47 (PDF 75-83: order of the four processes, signs, bhujantara ii.46 and its note, ii.47-49 equation of motion) and ii.59-63 (PDF 92-95, with the note continuing on PDF 96). Rendered at 110 dpi for the survey and at 410 dpi for every passage keyed.'
  effect: the cara carry entry has no stated action on a longitude; the engine moves the means' time to the sunrise by the cara at mean motion on every element (read from ii.58-63, i.67 and xiv.19), and every record of a day the cara acts on carries provisional:texts.suryasiddhanta.procedures.cara.application
  source: suryasiddhanta_burgess_1860
  notes: 'Reader''s note: Nearest statements: ii.46 (bhujantara, the sun''s equation applied to planets'' daily motion) and Whitney''s note on it (PDF 82: the ecliptic/equinoctial part of the equation of time "is not taken account of in this treatise"), keyed as procedures.bhujantara.rule and procedures.bhujantara.whitney_note_time. found nothing. Searched: suryasiddhanta_burgess_1860, verses and Whitney''s notes: i.60-67 with notes, PDF 43-48 (printed 182-187); ii.43-47 with notes, PDF 75-82 (printed 214-221): ii.43-45 stand on PDF 75-76 (not 80-82 as listed), Whitney''s note on ii.45 with its four result tables and the comparison with Ptolemy runs PDF 76-81, ii.46 and its note PDF 81-82, ii.47 PDF 82; ii.59-63 with notes, PDF 92 (from ii.59) to PDF 96 top (printed 231-235), the note on ii.61-63 running on to PDF 96. Figures 6 and 8 and the numeric tables were not read cell by cell (they hold no statement). Reader''s note: No verse in these ranges, and no note on them, applies the ascensional difference to a body''s longitude or mean place. The ascensional difference (cara) is stated only in ii.61-63: it is found from the declination and the equinoctial shadow through the earth-sine and the day-radius, taken as respirations, and added to or subtracted from the quarter of the diurnal circle to give the half-day and half-night (of a planet, or of an asterism by its declination); that is a correction of the length of day and night, not of the place. Whitney''s note on ii.61-63 works the Washington day and night lengths this way and glosses cara as meaning variable. The corrections the ranges do apply to places are: the correction for distance from the prime meridian applied to the mean places (i.60-61, with i.62-65 on finding that distance); the reduction of a mean place from midnight to a chosen hour by proportion of the daily motion (i.67); the equations of the apsis and of the conjunction applied to the mean place (ii.43-45); and in ii.46 a correction of the planet''s true place proportional to its daily motion and to the sun''s equation (from the base-sine), applied in the same direction as the sun''s. i.66 concerns where the week-day begins east and west of the meridian. this gap stays as read.'
- key: texts.suryasiddhanta.procedures.cara.day_night
  value: 'Multiply the sine of declination by the equinoctial shadow, and divide by twelve; the result is the earth-sine (kshitijyâ); this, multiplied by radius and divided by the day-radius, gives the sine of the ascensional difference (cara): the number of respirations due to the ascensional difference Is shown by the corresponding arc. Add these to, and subtract them from, the fourth part of the corresponding day and night, and the sum and remainder are, when declination is north, the half-day and half-night; When declination is south, the reverse; these, multiplied by two, are the day and the night. The day and the night of the asterisms (bha) may be found in like manner, by means of their declination, increased or diminished by their latitude.'
