- key: texts.suryasiddhanta.procedures.ending_rounding
  status: gap
  reason: no verse of ii.64-69, and no note of Whitney's on them, states how an ending time (of a nakṣatra, yoga, tithi or karaṇa) is rounded or truncated
  searched: suryasiddhanta_burgess_1860 ii.64-69, the verses and Whitney's notes on them, PDF 96-99 (printed 235-238), including the top of PDF 96 where the note on ii.61-63 ends; ii.65 stands on printed p. 235 (PDF 96) rather than p. 236 as listed.
  effect: the Sūrya-siddhānta's ending times are reported unrounded in the text's units; any rounding is a convention of the report, recorded as such
  source: suryasiddhanta_burgess_1860
  notes: 'Reader''s note: The verses give the rules for the asterism (nakshatra), yoga, lunar day (tithi) and karana: the portion passed and the portion to come, found from the longitudes and turned into time by the daily motions. Neither the verses nor Whitney''s notes on them state how the resulting ending time is rounded or truncated; Whitney''s worked figures are printed to a last unit with no rule given for it.'
- key: texts.suryasiddhanta.procedures.time_reckoning
  status: gap
  reason: no verse states whether the day's time is mean or apparent solar time, nor how the sunrise used is reckoned; the identification with mean solar time is the translators' (Whitney's note on xiv.18-19)
  searched: 'suryasiddhanta_burgess_1860: i.10-14 with notes, PDF 9-13 (printed 148-152); i.59-67 with notes, PDF 43-48 (printed 182-187); ii.46 and its note, PDF 81-82 (printed 220-221); ii.59-63 with notes, PDF 92-96 (printed 231-235); iii.1-23, verse openings, PDF 100-114 (printed 239-253; iii.1-6 begin on PDF 100-101, before the listed PDF 102); xiv.1-27 with notes, PDF 270-278 (printed 409-417). Chapter xiv ends on PDF 278; PDF 279-281 are the Appendix and were not searched. Not read: the right half of the table on PDF 271 and the lower table tiles of PDF 275 (tabular figures only).'
  effect: the sunrise is the one ii.58-63 and i.67 imply; local times are reported in the text's reckoning with Whitney's identification cited as an editor's statement, not as the text's
  source: suryasiddhanta_burgess_1860
  notes: 'Nearest statements: nearest statements (not an answer to mean vs apparent): xiv.18-19, PDF 277 (printed 416), civil day counted from rising to rising and mean motions computed by civil time; i.66-67, PDF 47-48 (printed 186-187), places reckoned from midnight on the prime meridian. Reader''s note: No verse says whether the day''s time is mean or apparent (true) solar time, and none says how the sunrise used is computed (no rule for true versus mean sunrise, refraction or the sun''s disc). What the verses do state: the units of time up to the sidereal day, and the civil month as so many sunrises (i.11-12); the civil (sâvana) day reckoned from one rising to the next, and the mean motions of the planets computed by civil time (xiv.18-19); the mean places found for midnight on the prime meridian, reduced to another hour by proportion (i.67), with the week-day beginning earlier or later east and west of that meridian (i.66). The identification with mean solar time is the translators'' own: Whitney''s note on xiv.18-19 equates the civil reckoning, in its general sense, with mean solar time, and the translators'' contents heading of chapter xiv glosses xiv.18-19 likewise; Whitney''s note on i.12-13 says the civil day runs sunrise to sunrise and varies in length, and that in Southern India a month or year is counted from the sunrise nearest its actual beginning; his notes on ii.59 and ii.61-63 express the computed day lengths in mean solar time; his note on ii.46 says the correction there allows for part of what is called the equation of time. In chapter xiv the solar (saura) measure is defined by the sun''s actual motion (xiv.3 and note), but that is a measure of the solar month and year, not of the time of day.'
