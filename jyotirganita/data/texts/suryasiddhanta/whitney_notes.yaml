- key: texts.suryasiddhanta.procedures.time_reckoning.whitney_note_xiv18
  value: 'The term sâvana we have translated "civil," as being a convenient way of distinguishing this from the other kinds of time, and as being very properly applicable to the day as reckoned in practical use from sunrise to sunrise: in the more general sense, as denoting the mode of reckoning the mean motions of the planets, and the regency of successive periods, sâvana corresponds to what we call "mean solar" time. The word itself seems to be a derivative from savana, "libation," the three daily savanas, or the sunrise, noon, and sunset libations, being determined by this reckoning.'
  form: text
  unit: none
  script: latin
  source: suryasiddhanta_burgess_1860
