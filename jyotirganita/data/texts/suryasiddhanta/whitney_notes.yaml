- key: texts.suryasiddhanta.procedures.order.whitney_note
  value: 'The rule contained in the last verse is a general one, applying to all the processes of calculation of the equations of place, and has already been anticipated by us above. Its meaning is, that when the anomaly, (mandakendra), or commutation (çîghrakendra), reckoned always forward from the planet to the apsis or conjunction, is less than six signs, the equation of place is additive; when the former is more than six signs, the equation is subtractive. The reason is made clear by the figures given above, and by the explanations under verses 1−5 of this chapter. It should have been mentioned above, under verse 29, where the word kendra was first introduced, that, as employed in this sense by the Hindus, it properly signifies the position (see note to i. 53) of the "centre" of the epicycle—which coincides with the mean place of the planet itself—relative to the apsis or conjunction respectively. In the text of the Sûrya-Siddhânta it is used only with this signification: the commentary employs it also to designate the centre of any circle. Since the sun and moon have but a single inequality, according to the Hindu system, the calculation of their true places is simple and easy. With the other planets the case is different, on account of the existence of two causes of disturbance in their orbits, and the consequent necessity both of applying two equations, and also of allowing for the effect of each cause in determining the equation due to the other. For, to the apprehension of the Hindu astronomer, it would not be proper to calculate the two equations from the mean place of the planet; nor, again, to calculate either of the two from the mean place, and, having applied it, to take the new position thus found as a basis from which to calculate the other; since the planet is virtually drawn away from its mean place by the divinity at either apex (ucca) before it is submitted to the action of the other. The method adopted in this Siddhânta of balancing the two influences, and arriving at their joint effect upon the planet, is stated in verses 43 and 44. The phraseology of the text is not entirely explicit, and would bear, if taken alone, a different interpretation from that which the commentary puts upon it, and which the rules to be given later show to be its true meaning; this is as follows: first calculate from the mean place of the planet the equation of the conjunction, and apply the half of it to the mean place; from the position thus obtained calculate the equation of the apsis, and apply half of it to the longitude as already once equated; from this result find once more the equation of the apsis, and apply it to the original mean place of the planet; and finally, calculate from, and apply to, this last place the whole equation of the conjunction.'
  form: text
  unit: none
  script: latin
  source: suryasiddhanta_burgess_1860
