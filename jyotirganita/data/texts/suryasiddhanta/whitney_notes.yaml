- key: texts.suryasiddhanta.procedures.epoch_advance.whitney_note
  value: 'The proportion is as follows: as the number of nâḍîs in a day (sixty) is to those in the interval between midnight and the time for which the mean place of the planet is sought, so is the whole daily motion of the planet to its motion during the interval; and the result is additive or subtractive, of course, according as the time fixed upon is after or before midnight. In order to furnish a practical test of the accuracy of this text-book of astronomy, and of its ability to yield correct results at the present time, we have calculated, by the rule given in this verse, the mean longitudes of the planets for a time after midnight of the first of January, 1860, on the meridian of Ujjayinî, which is equal to the distance in time of the meridian of Washington, viz. 25n 28v 1p.8, or 0d.42453; and we present the results in the annexed table. The longitudes are given as reckoned from the vernal equinox of that date, which we make to be distant 18° 5′ 8″.25 from the point established by the Sûrya-Siddhânta as the beginning of the Hindu sidereal sphere; this is (see below, chap. viii) 10′ east of ζ Piscium. We have ascertained the mean places both as determined by the text of our Siddhânta, and by the same with the correction of the bîja. Added are the actual mean places at the time designated: those of the primary planets have been found from Le Verrier''s elements, presented in Biot''s treatise, as cited above; those of the moon, and of her apsis and node, were kindly furnished us from the office of the American Nautical Almanac, at Cambridge.'
  form: text
