- key: texts.suryasiddhanta.trig.construction
  value: 'The eighth part of the minutes of a sign is called the first sine (jyârdha); that, increased by the remainder left after subtracting from it the quotient arising from dividing it by itself, is the second sine. Thus, dividing the tabular sines in succession by the first, and adding to them, in each case, what is left after subtracting the quotients from the first, the result is twenty-four tabular sines (jyârdhapiṇḍa), in order, as follows:'
