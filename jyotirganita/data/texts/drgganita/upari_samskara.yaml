- key: texts.drgganita.upari_samskara.grahanamandana_1965.translation
  value: 48−50a. One second should be subtracted for every 200 years, from (the Mean position of) the Sun derived according to the Grahaṇamaṇḍana, to get its (correct Mean position). In the case of the Moon, however, one second should be added (to its Mean position) for every 41 years. In the case of the Node, one second should be added to (12r−Node) for every 135 years. From the Mean of the Higher Apsis should be subtracted one minute for every three years.
  form: text
  unit: statement
  script: latin
  source: grahanamandana_1965
  edition_page: 36
  pdf_page: 59
  locus: 'Appendix translation, 48–50a; extent from 48−50a. to years. (the translation of 48–50a). Text keyed as printed (spelling, diacritics, letters), with spacing at punctuation and parentheses normalised (none before,;: ? ! or), one after; none after, a dash between numbers or as a sign keyed as − (U+2212) and between words as — (U+2014), italics not marked, footnote marks not keyed.'
