- key: texts.aryabhatiya.procedures.gati.jivabhukti_moon.laghubhaskariya_1963
  value: From the (mean daily) motion of the (Moon's) mean anomaly subtract the preceding or succeeding arc (of the current element of the arc, i.e., the elementary arc containing the Moon) (according as the Moon is in the odd or even anomalistic quadrant). (Then) take (the tabulated Rsine-differences) on the basis of the (residue in) minutes of the (mean daily) motion of the Moon's mean anomaly, starting from the current Rsine-difference reversely and directly in the odd and even anomalistic quadrants respectively. The results (i.e., the Rsine-differences) corresponding to the fractions of the first and last elementary arcs should be determined by proportion (and added to the sum of the previous Rsine-differences). The Rsine-difference (corresponding to the daily motion of the Moon's mean anomaly) thus obtained multiplied by the (Moon's tabulated) epicycle and divided by 80 should be subtracted from or added to the Moon's mean daily motion as before (in the case of the Sun, i.e., according as the Moon's anomaly is in the half-orbit commencing with the sign Capricorn or in that commencing with the sign Cancer). This is known as (the Moon's) true (daily motion).
