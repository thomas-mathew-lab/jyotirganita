- key: texts.aryabhatiya.procedures.proportional_parts.tithi.mahabhaskariya_1960
  value: 'Divide the true longitude of the Moon as diminished by that of the Sun by 720 minutes (of arc); the quotient (obtained) denotes the number of tithis (elapsed). Multiply the remainder by 60 and divide (the product) by the difference between the (true) daily motions of the Sun and the Moon: then are obtained the ghaṭīs, vighaṭīs, and asus (elapsed of the current tithi). (The time in ghaṭīs, vighaṭīs, etc. of) the current tithi to elapse or elapsed is measured from sunrise.'
  form: text
