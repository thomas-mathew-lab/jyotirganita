- key: texts.aryabhatiya.procedures.ahargana.rule
  value: Add 3179 to the (number of elapsed) years of the Śaka era, (then) multiply (the resulting sum) by 12, and (then) add the (number of lunar) months (expired) since the commencement of Caitra. Set down (the result thus obtained) at (two) separate places; multiply (one) by (the number of) intercalary months in a yuga, which are 15,93,336 in a yuga; and divide (the product) by 5184 into 10,000 (i.e., by 5,18,40,000). Add the (resulting complete) intercalary months to the result placed at the other place. Then multiply (that sum) by 30 and (to the product) add the (lunar) days (i.e., tithis) expired (of the current month). Set down (the result thus obtained) in two places; multiply (one) by the (number of) omitted lunar days in a yuga, i.e., by 2,50,82,580, and divide by 1,60,30,00,080. The resulting (complete) omitted lunar days when subtracted from the result put at the other place give the (required) ahargaṇa.
  form: text
  unit: statement
  script: latin
  source: laghubhaskariya_1963
  file: laghubhaskariya_1963-laghubhaskariya-shukla-1963.pdf
  edition_page: 1
