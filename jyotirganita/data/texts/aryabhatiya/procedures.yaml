- key: texts.aryabhatiya.procedures.quadrant_convention.anomalistic_signs_note.mahabhaskariya_1960
  value: Beginning with the Sun's apogee, in Hindu astronomy, the kakṣāvṛtta (deferent or concentric) for the Sun is divided into four equal parts called anomalistic quadrants (pada or pāda) and twelve equal parts called anomalistic signs (rāśi). Thus there are three anomalistic signs in an anomalistic quadrant. The anomalistic signs are given the same names as the signs of the zodiac, viz., Aries (meṣa). Taurus (vṛṣa), Gemini (mithuna), etc. When the mean anomaly of the Sun is between 0° and 180°, the Sun is said to be in the six signs (or in the half-orbit) beginning with the anomalistic sign Aries; and when the mean anomaly of the Sun is between 90° and 270°, the Sun is said to be in the six signs (or in the half-orbit) commencing with the anomalistic sign Cancer; and so on. The same is true also for the planets, Mars, etc.
