- key: texts.aryabhatiya.procedures.gati.jivabhukti_moon.mahabhaskariya_1960
  value: (When the Moon is in the odd quadrant) subtract the part of the bāhu due to her mean anomaly lying in the elementary arc corresponding to the current Rsine-difference (antyajīvādhanuṣkhaṇḍa) from the daily motion of the (Moon's) mean anomaly; (when the Moon is) in the even quadrant, subtract the remainder obtained by subtracting that (part) from 225. Then take (as many) Rsine-differences in the reverse order, (if the Moon is) in the odd quadrant, or in the serial order, if the Moon is in the even quadrant, as correspond to (the above residue of) the motion of the (Moon's) mean anomaly (literally, the mean daily motion of the moon diminished by that of its apogee). (To the sum of those Rsine-differences) add the Rsine-differences (phala) corresponding to the arcs (of the daily motion of the Moon's mean anomaly which lie) in the first and last elementary arcs which are to be determined by proportion with the Rsine-differences (corresponding to those elementary arcs). Then calculate the (Moon's) equation of the centre (phala) corresponding to that (i.e., multiply that by the Moon's tabulated epicycle and divide by 80). The (Moon's) mean daily motion, when diminished or increased by that equation (according as the Moon is in the half-orbit beginning with the anomalistic sign Capricorn or in that beginning with the anomalistic sign Cancer), becomes truer than the true.
  form: text
