- key: texts.aryabhatiya.procedures.quadrant_convention.corrected_epicycle_rule.mahabhaskariya_1960
  value: Multiply the Rsine or Rversed-sine (of the part of the kendra lying in the current quadrant), according as the (current) quadrant is odd or even, by the difference between the (planet's) own epicycles (for the beginnings of the odd and even quadrants) and then divide (the product) by the radius; and apply the result (thus obtained) to the (planet's) epicycle (for the beginning of the current quadrant). Subtract (that result), when the epicycle for (the beginning of) the current quadrant is greater; add (that result), when the epicycle for (the beginning of) the current quadrant is smaller. Thus is obtained the (planet's) corrected epicycle.
