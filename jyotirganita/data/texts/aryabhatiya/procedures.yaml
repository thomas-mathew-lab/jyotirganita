- key: texts.aryabhatiya.procedures.desantara.yojana_distance.laghubhaskariya_1963
  value: The circumference of the Earth multiplied by the difference between the latitudes of (a place on) the prime meridian and the local place and divided by the number of degrees in a circle (i.e., by 360) gives the bāhu (i.e., the base of the longitude triangle) due to the local place. The oblique distance from that local place to (the place on) the prime meridian is the hypotenuse (of the triangle). The square root of the difference between the squares of that (hypotenuse) and the bāhu is said to be the longitude (in yojanas of that place).
