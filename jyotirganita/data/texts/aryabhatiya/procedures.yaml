- key: texts.aryabhatiya.procedures.application_order.inferior
  value: 'The method used in the case of Mercury and Venus is being described now. First add or subtract half the arc corresponding to the śīghraphala in the reverse order (i.e., according as the śīghrakendra is in the half-orbit beginning with Libra or in that beginning with Aries) to or from its own mandocca. Whatever correction is (then) derived from that (corrected) mandocca should, as a whole, be applied as correction to the mean longitude of the planet: then is obtained the true-mean longitude (of the planet). That corrected for (the correction due to) the śīghrocca gives the true longitude (of the planet).'
