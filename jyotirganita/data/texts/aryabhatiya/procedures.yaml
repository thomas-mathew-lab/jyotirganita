- key: texts.aryabhatiya.procedures.proportional_parts.tithi.laghubhaskariya_1963
  value: 'Having reduced (the longitude of) the Moon minus (the longitude of) the Sun to minutes of arc, divide it by 720: the quotient is the (number of) tithis elapsed (since new moon). On multiplying (the portions of the current tithi, elapsed and to be elapsed severally) by 60 and dividing by the difference between the (true) daily motions (of the Sun and Moon) are obtained (the ghaṭīs) elapsed and to be elapsed (of the current tithi).'
