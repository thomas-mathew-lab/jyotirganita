- key: texts.aryabhatiya.procedures.day_radius_earthsine.laghubhaskariya_1963
  value: 'Whatever be the square root of the difference between the squares of that (i.e., of the Rsine of the Sun''s declination) and of the radius is the (Sun''s) day-radius. The Rsine of the latitude multiplied by the Rsine of the (Sun''s) declination and divided by the Rsine of the colatitude is (known as) the (Sun''s) earthsine. This is multiplied by the radius and divided by the (Sun''s) day-radius: whatever is obtained is called the Rsine of the (Sun''s) ascensional difference.'
