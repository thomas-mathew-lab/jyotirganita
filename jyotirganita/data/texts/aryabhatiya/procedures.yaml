- key: texts.aryabhatiya.procedures.ahargana.weekday_correction.mahabhaskariya_1960
  value: The mean lunar day (madhyama-tithi) may, however, differ from a true lunar day (spaṣṭa-tithi) by one, so that the ahargaṇa obtained by the above process may sometimes be in excess or defect by one. To test whether the ahargaṇa (obtained by the above process) is correct, it is divided by seven and the remainder counted with Friday. If this leads to the day of calculation, the ahargaṇa is correct; if that leads to the preceding day, the ahargaṇa is in defect; and if that leads to the succeeding day, the ahargaṇa is in excess. When the ahargaṇa is found to be in defect, it is increased by one; when it is found to be in excess, it is diminished by one.
