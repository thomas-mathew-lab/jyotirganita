- key: texts.aryabhatiya.procedures.ahargana.rule.mahabhaskariya_1960
  value: Add 3179 to the number of elapsed years of Śaka kings; then multiply (that sum) by 12; and then add the number of months elapsed (since the beginning of Caitra). Put down the result at two places. At one place multiply (that) by the number of intercalary months in a yuga and divide by the number of solar months in a yuga; and add the resulting intercalary months (omitting the fraction of a month) to the result put at the other place. Multiply tha tsum by 30 and then add the number of lunar days (tithis) elapsed (since the beginning of the current month). Set down the result (i.e., the sum obtained) at two places. At one place multiply that by the number of omitted lunar days (in a yuga) and divide by the number of lunar days (in a yuga), and subtract the resulting omitted lunar days (neglecting the fraction of a day) from the result set down at the other place. The result (thus obtained) is the number of (mean) civil days elapsed since the beginning of Kaliyuga (at mean sunrise at Laṅkā on the given lunar day). These days are said to have commenced with Friday and at sunrise (at Laṅkā).
