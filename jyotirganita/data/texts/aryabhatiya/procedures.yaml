- key: texts.aryabhatiya.procedures.application_order.superior_full.aryabhatiya_1976
  value: 'Apply half the mandaphala to the mean longitude of the planet negatively or positively, according as the mandakendra is less than or greater than 180° and to the longitude of the planet''s apogee reversely. Then apply half the śīghraphala to the corrected longitude of the planet''s apogee negatively or positively, according as the śīghrakendra is less than or greater than 180°. Then calculate the mandaphala afresh and apply the whole of it to the (original) mean longitude of the planet negatively or positively, according as the mandakendra is less than or greater than 180°: this would give the true-mean longitude of the planet. Then calculate the śīghraphala again and apply the whole of it to the true-mean longitude of the planet positively or negatively, according as the śīghrakendra is less than or greater than 180°: this would give the true longitude of the planet.'
