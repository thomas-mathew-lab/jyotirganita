- key: texts.aryabhatiya.procedures.quadrant_convention.rule
  value: One should divide by the radius the Rsine or the Rversed-sine (of the part of the kendra lying in the current quadrant) as multiplied by the difference between the epicycles (for the beginnings of the odd and even quadrants) according as the (current) quadrant is odd or even. If the epicycle (in the beginning of the current quadrant) is smaller, add the (above) result to it; if the epicycle (in the beginning of the current quadrant) is greater, subtract the (above) result from it. Then is obtained the corrected epicycle. If this correction is not made, the motion (of the planet) would be like the jumping of a frog.
