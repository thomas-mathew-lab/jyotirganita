- key: texts.aryabhatiya.procedures.quadrant_convention.controversy.aryabhatiya_1976
  value: The Kerala astronomer Śaṅkaranārāyaṇa (A. D. 869) refers to some astronomers (without naming them) who said that there was also the view that the epicycles given by Āryabhaṭa I corresponded to the end-points of the anomalistic quadrants. The Kerala astronomer Govinda-svāmī, who also refers to this controversy, is of the opinion that śīghra epicycles stated above correspond to the beginnings of the respective anomalistic quadrants, but the manda epicycles stated above correspond to the last points of the respective anomalistic quadrants, and, consequently, he has replaced the rules referred to above by another rule which has been quoted by Udayadivākara (1073 A.D.) in his commentary on LBh, ii. 31-32. This controversy is due to the fact that Āryabhaṭa I himself does not specify whether the epicycles given by him correspond to the initial points or last points of the anomalistic quadrants.
