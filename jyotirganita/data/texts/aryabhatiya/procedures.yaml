- key: texts.aryabhatiya.procedures.application_order.superior.mahabhaskariya_1960
  value: Calculate half the arc corresponding to the (planet's) mandakendraphala and apply that to the (planet's) mean longitude depending on the quadrant (of the planet's kendra) as in the case of the Sun. (Then calculate the śīghrakendraphala). Multiply the radius by the śīghrakendraphala and divide (the product) by the (planet's) śīghrakarṇa; then reduce that to arc. Apply half of that arc to the longitude obtained above, reversely (i.e., add when the śīghrakendra is in the half orbit beginning with the sign Aries and subtract when the śīghrakendra is in the half orbit beginning with Libra). Therefrom calculate (the arc corresponding to) the manda(kendra)phala and apply the whole of that to the mean longitude of the planet. Thus are obtained the true-mean longitudes of Mars, Saturn, and Jupiter. The true-mean longitude corrected for the arc derived from the śīghrakendraphala (literally, the arc corresponding to the result derived from the longitude of the śīghrocca minus the true-mean longitude of the planet) is to be known as the true longitude.
