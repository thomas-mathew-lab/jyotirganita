- key: texts.aryabhatiya.procedures.application_order.superior
  value: 'Having added half the bāhuphala due to the mandocca (apogee) to or subtracted that from the mean longitude of the planet as before, the result should be subtracted from (the longitude of) the śīghrocca: that (difference) is called the śīghrakendra. From that obtain the bāhuphala: (and) having multiplied that by the radius, divide (the product) by the (śīghra)karṇa. Half the arc corresponding to the result obtained should be added or subtracted according as the śīghrakendra is in the half-orbit beginning with Aries or in that beginning with Libra. Then after subtracting (the longitude of) the mandocca from that (result), the entire bāhuphala (derived from that difference), reduced to arc, should be applied (as correction, positive or negative) to the mean longitude of the planet (according as the mandakendra is in the half-orbit beginning with the sign Libra or in that beginning with the sign Aries): this (result) is known as the true-mean longitude (of the planet). (Then) after subtracting the resulting quantity (viz. the true-mean longitude of the planet) from the śīghrocca, the entire correction obtained by the śīghrocca process, reduced to arc, should be applied (as correction, positive or negative,) to the true-mean longitude of the planet (according as the śīghrakendra is in the half-orbit beginning with Aries or in that beginning with Libra): thus is obtained the true longitude of the planet.'
  form: text
  unit: statement
