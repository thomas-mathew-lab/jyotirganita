- key: texts.aryabhatiya.procedures.rsine.rule.mahabhaskariya_1960
  value: 'Reduce the arc to minutes and then divide by 225: the quotient denotes the number of (tabulated) Rsine-differences (or Rversed-sine-differences) to be taken completely. Then multiply the remainder by the next (or current) Rsine-difference (or Rversed-sine-difference) and divide (the product) by 225. Add the quotient (thus obtained) to the sum of the (tabulated) Rsine-differences (or Rversed-sine-differences) obtained before. The sum thus obtained is the Rsine (or Rversed-sine) of the given arc.'
