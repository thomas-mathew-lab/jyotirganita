- key: texts.aryabhatiya.procedures.weekday.check
  value: The mean lunar day may, sometimes, differ from a true lunar day by one, so that the ahargaṇa obtained by the above rule may sometimes be in excess or defect by one. To test whether the ahargaṇa is correct, it should be divided by seven and the remainder counted with Friday. If this leads to the day of calculation, the ahargaṇa is correct; if that leads to the preceding day, the ahargaṇa is in defect; and if that leads to the succeeding day, the ahargaṇa is in excess. When the ahargaṇa is found to be in defect, it should be increased by one; when it is found to be in excess, it should be diminished by one.
