- key: texts.aryabhatiya.procedures.cara.rule
  value: The minutes of arc in the arc of that (Sun's ascensional difference) are known as prāṇa (or asu). On multiplying them by the (Sun's) true daily motion and dividing by 21600 are obtained the minutes, etc., (of the Sun's motion corresponding to its ascensional difference). (In order to obtain the Sun's true longitude) at sunrise (for the local place) these (minutes, etc.) should be subtracted (from the Sun's true longitude at sunrise for the local equatorial place) provided the Sun is in the northern hemisphere (i. e., to the north of the equator) and added if the Sun is in the southern (hemisphere). In the case of sunset, (the law of correction is) the reverse. In the case of midday or midnight, this (correction) should not be performed.
