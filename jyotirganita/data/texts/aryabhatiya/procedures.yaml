- key: texts.aryabhatiya.procedures.ahargana.epoch_note.mahabhaskariya_1960
  value: The above rule tells us how to determine the number of mean civil days elapsed at mean sunrise at Laṅkā on the given lunar day (tithi) since the beginning of Kaliyuga (when all the planets were in conjunction at the first point of the asterism Aśvinī). According to Āryabhaṭa I and Bhāskara I, the duration of Kaliyuga is 10,80,000 years and it began on Friday, February 18, B.C. 3102, at sunrise at Laṅkā in the beginning of the month Caitra. The Śaka Era, which is usually used in Hindu astronomy for reckoning the years, commenced 3179 years after the beginning of Kaliyuga.
