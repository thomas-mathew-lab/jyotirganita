- key: texts.aryabhatiya.procedures.cara.ascensional_difference_note.mahabhaskariya_1960
  value: The ascensional difference is defined by the arc of the celestial equator lying between (i) the equatorial horizon and (ii) the secondary to the equator passing through the intersection of the diurnal circle and the (eastern or western) horizon. It is measured in time (i.e., in asus). The ascensional difference of the Sun thus denotes the difference between the times of rising of the Sun on the local and equatorial horizons.
