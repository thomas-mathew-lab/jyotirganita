- key: texts.aryabhatiya.procedures.ahargana.intercalary_correction.mahabhaskariya_1960
  value: Similarly, when a true intercalary month has recently occurred prior to the given lunar month or is about to occur thereafter, the true lunar month may differ from the mean lunar month by one. When a true intercalary month has occurred prior to the given month and the intercalary fraction amounts to one month approximately, then the whole number of mean intercalary months obtained in the above process is increased by one. When no intercalary month has occurred prior to the given month but the intercalary fraction is small enough, the whole number of mean intercalary months obtained in the above process in diminished by one.
