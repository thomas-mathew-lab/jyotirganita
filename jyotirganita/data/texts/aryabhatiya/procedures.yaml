- key: texts.aryabhatiya.procedures.declination.rule.mahabhaskariya_1960
  value: 'Multiply the Rsine of the given longitude by 1397 and always divide by the radius; the result is the Rsine of the declination for that time. Subtract the square of that (Rsine of the declination) from the square of the radius and then take the square root (of the difference); the result is called the day-radius. Multiply the Rsine of the latitude by (the Rsine of) the given declination and divide by (the Rsine of) the colatitude: the result is the earthsine. Multiply the earthsine by the radius and then divide (the product) by the day-radius; then reduce (the resulting Rsine) to arc. Whatever (arc) is thus obtained is termed "the ascensional difference" by the best amongst the good (astronomers).'
  form: text
  unit: statement
