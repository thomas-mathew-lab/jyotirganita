- key: texts.aryabhatiya.procedures.correction_signs.editors_rule
  value: 'The law of addition and subtraction of the mandaphala and śīghraphala in the four quadrants is mentioned also by Bhāskara I, (A.D. 629), Brahmagupta (A.D. 628) and Śrīpati (c. A.D. 1039), but it was more convenient to apply the mandaphala as obtained by the formula: mandaphala=Rsin θ×manda epicycle/360, (θ being the planet''s mandakendra reduced to bhuja) negatively or positively, according as the mandakendra was less than or greater than 180°, and the śīghra-phala as obtained by the formula śīghraphala=Rsin θ×śīghra epicycle/360×R/H, (θ being the planet''s śīghrakendra reduced to bhuja and H the planet''s śīghrakarṇa) positively or negatively, according as the śīghrakendra was less than or greater than 180°. And so the Hindu astronomers have generally adopted these latter rules.'
