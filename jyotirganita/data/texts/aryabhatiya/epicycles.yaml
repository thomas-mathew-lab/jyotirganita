- key: texts.aryabhatiya.epicycles.quadrants.laghubhaskariya_1963
  value: The manda epicycles (of the planets beginning with Mars) are 14, 7, 7, 4, and 9 (in the beginnings of odd quadrants) and 18, 5, 8, 2, and 13 in the (beginnings of) even quadrants. 50 plus 3, 30 plus 1, 16, 59, and 9 have been stated to be the śīghra epicycles (of the same planets) (in the beginnings of odd quadrants) and the same diminished respectively by 2, 2, 1, 2, and 1 are their own (śīghra) epicycles in the (beginnings of) even quadrants.
  form: text
  unit: statement
  script: latin
