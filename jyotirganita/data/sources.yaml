# name. A held edition lists its files by name, each with its SHA-256, size
# and page count (the scans are not distributed); born_digital is per file,
# by inspection, and the entry's born_digital is true only when every PDF
# is. An online entry records its URL, the date it was fetched and the
# file's SHA-256.

