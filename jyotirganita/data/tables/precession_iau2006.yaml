statements:
  time_argument:
    page: 22
    text: Due to their theoretical bases, the original development of the precession quantities as functions
      of time can be considered as being expressed in TDB. However, in practice, TT is used in the above
      expressions in place of TDB. The largest term in the diﬀerence TDB−TT being 1.7 ms × sin l′ (where
      l′ is the mean anomaly of the Sun), the resulting error in the precession quantity ψA is periodic,
      with an annual period and an amplitude of 2.7′′ × 10−9, which is signiﬁcantly below the required
      microarcsecond accuracy. This applies to Eq. (5.38)-(5.40), as well as to the polynomial part of
      Eq. (5.16) (i.e. the expression for the CIP’s GCRS X, Y coordinates).
  iau2000a_accuracy:
    page: 18
    text: That model is expected to have an accuracy of about 10 µas for most of its terms.
  iau2000b_accuracy:
    page: 19
    text: As recommended by IAU 2000 Resolution B1.6, an abridged model, designated IAU 2000B, is available
      for those who need a model only at the 1 mas level. Such a model has been developed by McCarthy
      and Luzum (2003). It includes fewer than 80 lunisolar terms plus a bias to account for the eﬀect
      of the planetary terms in the time period under consideration. It provides the celestial pole motion
      with an accuracy that does not result in a diﬀerence greater than 1 mas with respect to that of
      the IAU 2000A model during the period 1995–2050.
  era_definition:
    page: 9
    text: ERA(Tu) = 2π(0.7790572732640 + 1.00273781191135448Tu), (5.14) where Tu=(Julian UT1 date−2451545.0),
      and UT1=UTC+(UT1−UTC),
