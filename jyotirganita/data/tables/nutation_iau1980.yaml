statements:
  time_argument: where t is measured in Julian Centuries of 36525 days of 86400 seconds of Dynamical Time
    since J2000.0 and where 1ʳ = 360° = 1296000.0″ (Simon et al., 1994).
  t_prime_u: T'_u = d'_u/36525, d'_u being the number of days elapsed since 2000 January 1, 12h UT1, taking
    on values ±0.5, ±1.5, ...
  table_caption: IAU 1980 Theory of Nutation in longitude Δψ and obliquity Δε, referred to the mean equator
    and equinox of date, with t measured in Julian centuries from epoch J2000.0. The signs of the fundamental
    arguments, periods, and coefficients may differ from the original publication. These have been changed
    to be consistent with other portions of this chapter.
  table_unit: MULTIPLIERS OF |  PERIOD |  LONGITUDE |  OBLIQUITY  |  | (0.0001″) |  (0.0001″)
  gst_terms_from: The last two terms have not been included in the IERS Standards previously. They should
    not be included in (iii) until 1 January 1997 when their use will begin. This date is chosen to minimize
    any discontinuity in UT1.
