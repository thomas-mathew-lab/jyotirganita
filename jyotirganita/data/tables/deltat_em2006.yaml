tidal_statement:
- All values of ΔT based on Morrison and Stephenson [2004] assume a value for the Moon's secular acceleration
  of -26 arcsec/cy^2.
- However, the ELP-2000/82 lunar ephemeris employed in the Canon uses a slightly different value of -25.858
  arcsec/cy^2.
- Thus, a small correction "c" must be added to the values derived from the polynomial expressions for
  ΔT before they can be used in the Canon
- c = -0.000012932 * (y - 1955)^2
- Since the values of ΔT for the interval 1955 to 2005 were derived independent of any lunar ephemeris,
  no correction is needed for this period.
