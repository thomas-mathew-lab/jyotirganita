notes: 'Mean time at the observer''s meridian, from the place''s longitude: civil mean time counted from mean midnight, 12 hours after the astronomers'' mean-noon count sewell_dikshit_1896 states. sewell_dikshit_1896''s ''mean sunrise at 0 h, roughly 6 a.m.'' is the Indian count of the same mean time.'
data:
- key: time_standards.lmt.definition.sewell_dikshit_1896
  value: The mean sunrise at any place is calculated as taking place at 0 gh. or 0 h.—roughly 6 a.m. in European civil reckoning; and the mean time of a place is the time counted from 0 gh. or 0 h
