standard: ist
title: Indian Standard Time
definition:
  kind: utc_offset
  offset: +05:30
  datum: time_standards.ist.definition.rashtriya_panchanga_1959
  witnesses: [time_standards.ist.definition.calendar_reform_committee_1955]
in_force:
  table: tzdata_asia_kolkata
  periods:
  - from: 1906-01-01
    to: 1941-10-01
    offset: +05:30
    line: 4
  - from: 1941-10-01
    to: 1942-05-15
    offset: +06:30
    line: 5
    war_time: true
  - from: 1942-05-15
    to: 1942-09-01
    offset: +05:30
    line: 6
  - from: 1942-09-01
    to: 1945-10-15
    offset: +06:30
    line: 7
    war_time: true
  - from: 1945-10-15
    to: open
    offset: +05:30
    line: 8
notes: The offset is printed by rashtriya_panchanga_1959 and calendar_reform_committee_1955. The dates of force and the war-time periods (an hour of daylight saving) are the IANA time-zone database's (iana_tzdata), whose own comment calls its source for 1941–1945 dubious; a fetched table, never a witness for verified. A period's bounds are wall-clock midnights, as the database's UNTIL column reads.
