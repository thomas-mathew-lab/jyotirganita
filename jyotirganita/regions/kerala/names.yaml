region: kerala
notes: 'The Kerala profile''s name tables. Every name has a canonical ASCII id, its forms by script as datum keys, and its accepted Latin spellings (each printed form a datum). Malayalam from travancore_panchangam_1921 (the Travancore Government Pañcāṅga, ME 1097: printed 61 and 63); Latin from sewell_dikshit_1896 (Table VIII, Art. 5, Art. 29) and, for the months, calendar_reform_committee_1955''s almanac replies (30) and (32). The month lists are keyed by list position (masa_list_*), and the index map below places them, so that no key or locus states where a list starts. Devanagari: a gap per class. The Malayalam forms await the library author''s batch sign-off; until then every record that prints one carries provisional:<key>.'
classes:
  masa:
    count: 12
    index: the rāśi of the solar month, 1 = Meṣa
  nakshatra:
    count: 27
    index: the nakṣatra of §6.1, 1 = the first
  yoga:
    count: 27
    index: the yoga of §6.1, 1 = the first
  tithi:
    count: 16
    index: tithis 1–15 of a pakṣa (15 the full moon) and 30 the new moon; a kṛṣṇa tithi 16–29 takes the name of tithi n − 15 with its pakṣa
  karana:
    count: 11
    index: 'the karaṇa''s place in the classical order of eleven (§6.1): 1–7 the seven movable, 8–11 the four fixed'
  vara:
    count: 7
    index: the week-day, 1 = Sunday (core/calendar.py's Weekday order)
karana_cycle: calendar.karana_cycle.sewell_dikshit_1896
