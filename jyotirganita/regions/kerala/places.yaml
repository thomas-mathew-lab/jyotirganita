notes: 'The Kerala place table. No held source prints a palabhā or a yojana offset for any of the five places (the route (a) gaps regions.kerala.places.<id>.palabha in coordinates.yaml), so a place reaches the Āryabhaṭan methods (aryabhatiya and parahita, one text) by route (b) from gopala_varyar_1954''s printed modern coordinates, or not at all (Thalassery and Kochi: no printed coordinate). The coordinates and the place-name statements are data of coordinates.yaml; the names in Malayalam are left for later work leads.'
