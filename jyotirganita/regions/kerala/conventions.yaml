region: kerala
notes: The Kerala profile's conventions, each part naming the datum that cites it.
civil_day:
  start: sunrise
  datum: regions.kerala.conventions.civil_day.start.sewell_dikshit_1896
  witnesses: [regions.kerala.conventions.civil_day.weekday.sewell_dikshit_1896]
assignment:
  default: at_sunrise
  datum: regions.kerala.conventions.assignment.at_sunrise.sewell_dikshit_1896
ksaya_vrddhi:
  ksaya: regions.kerala.conventions.ksaya.sewell_dikshit_1896
  vrddhi: regions.kerala.conventions.vrddhi.sewell_dikshit_1896
month_rule:
  rule: aparahna_parts
  parts: regions.kerala.conventions.month_rule.parts.sewell_dikshit_1896
  within: regions.kerala.conventions.month_rule.within.sewell_dikshit_1896
  datum: regions.kerala.conventions.month_rule.statement.sewell_dikshit_1896
  region: regions.kerala.conventions.month_rule.region.sewell_dikshit_1896
  example: authority/calendar/sewell_dikshit_1896_art28_month_rule
  provisional: the rule's only statement held is sewell_dikshit_1896's (Sewell–Dikshit, an editor's statement of practice); Pillai's (pillai_1922_ephemeris vol. I) is not held, gopala_varyar_1954 states none, and the practice witness of 1868 is left for later work
  searched: [regions.kerala.conventions.month_rule.statement.pillai_1922_ephemeris, regions.kerala.conventions.month_rule.statement.gopala_varyar_1954, regions.kerala.conventions.month_rule.practice.basel_panchangam_1868]
  selectable:
  - rule: following_day
    datum: regions.kerala.conventions.month_rule.following_day.basel_panchangam_1868
    provisional: the rule (the month begins on the civil day after the saṅkramam) is witnessed only by the 1868 almanac, whose pages are left for later work; its pinning test is left for later work
  - rule: sunset
    datum: regions.kerala.conventions.month_rule.sunset.statement.sewell_dikshit_1896
    provisional: sewell_dikshit_1896 Art. 28 (2) states the rule for the Tamil and Tinnevelly countries (regions.kerala.conventions.month_rule.sunset.region.sewell_dikshit_1896), not for Malabar; offered for the records of that side; no printed example pins it, and an entry at sunset itself, which the rule does not name, is taken as not before it
eras:
- era: kali
  year_start:
    default: 'true'
    selectable: [mean]
    witnesses:
      'true': [eras.kali.year_start.true.vakyakarana_1962]
      mean: [eras.kali.epoch.day_start.vakyakarana_1962]
- era: saka
  year_start:
    default: mesha
    selectable: []
    witnesses:
      mesha: [eras.saka.year_start.calendar_reform_committee_1955]
- era: kollam
  year_start:
    default: simha
    selectable: [kanya]
    witnesses:
      simha: [regions.kerala.conventions.kollam_year_start.calendar_reform_committee_1955_30]
      kanya: [regions.kerala.conventions.kollam_year_start.calendar_reform_committee_1955_32]
encodings:
  ending:
    unit: nadika
    direction: elapsed
    reference: sunrise
    datum: regions.kerala.conventions.encoding.column_sense.travancore_panchangam_1921
    witnesses: [regions.kerala.conventions.civil_day.start.sewell_dikshit_1896]
sunrise_event: regions.kerala.conventions.sunrise_event
time_standard: regions.kerala.conventions.almanac_time_standard
