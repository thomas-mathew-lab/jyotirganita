  value: അഭീഷ്ടദിവസത്തെ ചന്ദ്രസ്ഫുടംകൊണ്ടു് തദ്ദിവസത്തെ നക്ഷത്രത്തെ അറിഞ്ഞു് നക്ഷത്രാന്ത്യസ്ഫുടവും ചന്ദ്രസ്ഫുടവും തമ്മിലന്തരിച്ചു് ആദ്യമായി നക്ഷത്രത്തിൽ ചെല്ലുവാനുള്ള വികലകളെ അഭീഷ്ടദിവസത്തെ ചന്ദ്രസ്ഫുടഗതികൊണ്ടു്, (ഗതി അസ്തമയത്തിനുള്ളതുമതി) 'അതായതു് അഭീഷ്ടദിവസത്തെ ചന്ദ്രസ്ഫുടത്തെ അടുത്ത ദിവസത്തെ ചന്ദ്രസ്ഫുടത്തിൽനിന്നു കുറച്ചുകിട്ടുന്ന ഗതി എന്നു സാരം. ഗതി കലയും ശേഷം ദശാംശസ്ഥാനങ്ങളും ഉപയോഗിച്ചിരിക്കണം.' ഹരിച്ചാൽ പ്രായിക (സ്ഥൂല) നക്ഷത്രാന്ത്യം കിട്ടും.
