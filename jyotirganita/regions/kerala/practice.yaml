  value: പിന്നീടു് ഈ കിട്ടിയ നാഴികവിനാഴികകളിൽ വിനാഴികാ സ്ഥാനത്തു് അർദ്ധാധികം ഉണ്ടെങ്കിൽ നാഴികയിൽ കൂട്ടികിട്ടുന്നതും ആ നാഴികകളെ അറുപതിൽനിന്നു കുറച്ചതും തമ്മിൽ ഗുണിച്ചുകിട്ടുന്നതിനെ പൂർവ്വാപരദിവസങ്ങളിലെ ചന്ദ്രഗത്യന്തരചതുർത്ഥാംശംകൊണ്ടു്, (1/4) (അഭീഷ്ടദിവസത്തെ ചദ്ധസ്ഫുടന്നിൽനിന്നു തലനാളത്തെ സ്ഫുടം കുറച്ചാൽ അതു് പൂർവ്വദിവസത്തെ ഗതിയും അഭീഷ്ടദിവസത്തിന്റെ പിറ്റേദിവസത്തെ സ്ഫുടത്തെ അതിനടുത്ത ദിവസത്തെ സ്ഫുടത്തിൽനിന്നു കുറച്ചാൽ അപരദിവസത്തെ ചന്ദ്രഗതിയും കിട്ടും. ഈ ഗതികൾ തമ്മിലാണു് അന്തരിക്കേണ്ടതു്) ഗുണിച്ചു് അഭീഷ്ടദിവസചന്ദ്രഗതികൊണ്ടുതന്നെ ഹരിച്ചാൽ സൂക്ഷ്മമായ നക്ഷത്രാന്ത്യസമയം (കഴിയുന്ന) ലഭിക്കുന്നതാണു്.
